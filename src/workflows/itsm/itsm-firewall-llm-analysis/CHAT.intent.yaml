workflow: itsm-firewall-llm-analysis
priority: 110
description: 按工单的策略申请表（policy_file_url，http 地址）生成防火墙策略和变更工单，再由模型分析变更风险

match:
  require_any:
    - 防火墙
    - 策略
  require_any_secondary:
    - LLM
    - llm
    - 结果分析
    - LLM分析

required_context:
  - ticket_id
  - policy_file_url

context_defaults:
  ticket_title: 防火墙策略变更
  change_purpose: 根据用户请求生成防火墙策略、编写变更工单并进行 LLM 分析
  analysis_focus: summary

response_template: |
  [OK] 已启动防火墙变更 + LLM 分析流程

  - **流程 ID**: `{run_id}`
  - **工单**: {ticket_id}
  - **步骤**: {workflow_description}

  流程在后台执行，完成后将收到站内通知。
