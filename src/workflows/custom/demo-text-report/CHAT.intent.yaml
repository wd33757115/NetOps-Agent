# 有这个文件、且插件已发布，问答助手才能按用户要求启动它。
workflow: demo-text-report
description: 开发手册演示：统计一段文本并生成报告；同时给出修改后的文本（text_after）时再对比前后差异

# match 只用于编辑器里的“匹配预览”；聊天由模型按 description 判断。
match:
  require_any:
    - 文本报告

required_context:
  - text
