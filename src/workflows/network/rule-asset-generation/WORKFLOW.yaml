name: rule-asset-generation
description: 使用脱敏结构化数据生成、验证、回放并持久化完整规则资产包
version: "2.0"

test:
  context:
    command: display cpu
    vendor: Generic
    model: LAB
    source_ref: workflow:test:rule-asset-generation
    schema_id: workflow-test-cpu
    generation_provider: builtin
    max_agent_attempts: 3
    records:
      - slot: "0"
        cpu_5s: "18"
        cpu_1m: "20"
        cpu_5m: "19"
      - slot: "1"
        cpu_5s: "92"
        cpu_1m: "88"
        cpu_5m: "85"
    observation_type: device.cpu.utilization
    field_name: cpu_5s
    field_semantics:
      semantic_type: gauge
      unit: percent
    historical_values: [18, 20, 25, 40, 88, 92]
    device_role: lab
    policy_intent: CPU 高利用率需要产生告警，恢复阈值必须低于告警阈值
    event_intent: 生成 CPUHigh 与 CPURecovered 候选规则
    replay_limit: 1000
  required_context:
    - command
    - records

steps:
  - name: observation_contract
    label: 生成数据映射契约
    skill: observation-contract-generator
    inputs:
      mode: infer_and_validate
      command: ${context.command}
      vendor: ${context.vendor}
      model: ${context.model}
      records: ${context.records}
      record_groups: ${context.record_groups}
      proposal: ${context.proposal}
      observation_targets: ${context.observation_targets}
      strict_observation_targets: ${context.strict_observation_targets}
      canonical_identity_constraint: ${context.canonical_identity_constraint}
      policy_intent: ${context.policy_intent}
      event_intent: ${context.event_intent}
      generation_provider: ${context.generation_provider}
      max_agent_attempts: ${context.max_agent_attempts}
      agent_loop: true

  - name: rule_target_planning
    label: Compile validated rule targets
    skill: rule-target-planner
    inputs:
      contract: ${steps.observation_contract.result.proposal}
      records: ${context.records}

  - name: change_policy
    label: 生成变化策略
    skill: change-policy-generator
    inputs:
      mode: infer_and_validate
      observation_type: ${steps.rule_target_planning.result.observation_type}
      field_name: ${steps.rule_target_planning.result.field_name}
      policy_targets: ${steps.rule_target_planning.result.policy_targets}
      records: ${context.records}
      historical_values: ${context.historical_values}
      historical_values_by_field: ${steps.rule_target_planning.result.historical_values_by_field}
      device_role: ${context.device_role}
      policy_intent: ${context.policy_intent}
      generation_provider: ${context.generation_provider}
      max_agent_attempts: ${context.max_agent_attempts}
      agent_loop: true

  - name: event_rule
    label: 生成事件规则候选
    skill: event-rule-generator
    inputs:
      contract: ${steps.observation_contract.result.proposal}
      change_policy: ${steps.change_policy.result.policy}
      change_policies: ${steps.change_policy.result.target_policies}
      event_observation_types: ${steps.rule_target_planning.result.event_observation_types}
      intent: ${context.event_intent}
      event_constraints: ${context.event_constraints}
      event_constraints_by_observation_type: ${context.event_constraints_by_observation_type}
      generation_provider: ${context.generation_provider}
      max_agent_attempts: ${context.max_agent_attempts}
      agent_loop: true

  - name: event_rule_validation
    label: 验证全部事件规则候选
    skill: event-rule-validator
    inputs:
      mode: candidates
      candidate_rules: ${steps.event_rule.result.rules}
      agent_loop: true

  - name: event_rule_replay
    label: 历史回放事件规则候选
    skill: event-rule-replay
    inputs:
      candidate_rules: ${steps.event_rule.result.rules}
      limit: ${context.replay_limit}
      run_ids: ${context.replay_run_ids}
      include_active_collisions: true

  - name: persist_assets
    label: 持久化规则资产包
    skill: rule-asset-persister
    inputs:
      source_ref: ${context.source_ref}
      schema_id: ${context.schema_id}
      schema_ref: ${context.schema_ref}
      source_template_id: ${context.source_template_id}
      command: ${context.command}
      vendor: ${context.vendor}
      model: ${context.model}
      observation_type: ${steps.rule_target_planning.result.observation_type}
      rule_generation_seed_job_id: ${context.rule_generation_seed_job_id}
      rule_generation_context_id: ${context.rule_generation_context_id}
      rule_generation_context_digest: ${context.rule_generation_context_digest}
      contract_result: ${steps.observation_contract.result}
      change_policy_result: ${steps.change_policy.result}
      event_rule_result: ${steps.event_rule.result}
      event_rule_validation: ${steps.event_rule_validation.result}
      event_rule_replay: ${steps.event_rule_replay.result}

on_complete:
  message: 规则资产包生成、验证、历史回放与持久化已完成
  notification:
    title: 规则资产包生成完成
    body: 候选资产已保存；只有全部门禁通过的 Bundle 才能整包审批并原子发布。
    level: success
