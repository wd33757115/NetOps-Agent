name: rollout-live-capture
description: 灰度发布专用的只读原始证据采集，不生成生产状态、变化或事件
version: "1.0"

test:
  context:
    filter_params: {}
    execution_plan:
    execution_plan_id:
    ticket_id:
    save_baseline: false
    mode: parser_validation
    patrol_batch_id:

steps:
  - name: capture
    label: 采集冻结检查项原始输出
    skill: device-patrol
    inputs:
      filter_params: ${context.filter_params}
      execution_plan: ${context.execution_plan}
      execution_plan_id: ${context.execution_plan_id}
      ticket_id: ${context.ticket_id}
      save_baseline: false
      mode: parser_validation

on_complete:
  message: 灰度发布原始证据采集已完成
  notification:
    title: 灰度发布采集完成
    body: 原始命令快照已写入隔离验证数据集，未更新生产状态或事件。
    level: success
