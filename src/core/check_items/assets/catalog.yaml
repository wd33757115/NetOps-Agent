- id: interface.optical_power
  version: 16
  name: Interface optical power
  category: interface
  description: Evaluate transceiver presence and measured receive/transmit optical power.
  result_mode: structured
  assessment_mode: health
  canonical_contract:
    entity_type: interface_optical
    identity_dimensions:
    - interface
    - channel
    observations:
    - observation_type: interface.optical.presence
      semantic_type: state
      canonical_field: transceiver_present
      dimensions:
      - channel
      required: true
      mapping_guidance: Map explicit presence/absence evidence; an empty source status may mean present only when samples
        prove that convention.
      policy_constraints:
        allowed_compare_modes:
        - state_transition
        - enum_transition
      event_constraints:
        role_event_types:
          down: TransceiverAbsent
          up: TransceiverRestored
        required_event_types:
        - TransceiverAbsent
        - TransceiverRestored
        required_event_classes:
          TransceiverAbsent: fault
          TransceiverRestored: recovery
        required_severities:
          TransceiverAbsent: major
          TransceiverRestored: info
        required_recovery_pairs:
        - fault: TransceiverAbsent
          recovery: TransceiverRestored
        max_rule_count: 2
    - observation_type: interface.optical.rx_power
      semantic_type: gauge
      unit: dbm
      canonical_field: rx_power_dbm
      dimensions:
      - channel
      value_type: number
      required: true
      required_when:
        field: transceiver_present
        equals: present
      mapping_guidance: Map only the current receive optical-power measurement, not alarm or warning thresholds.
      context_fields:
      - part_number
      - serial_number
      threshold_references:
        high:
          field_name: rx_high_warning_dbm
        critical_high:
          field_name: rx_high_alarm_dbm
        low:
          field_name: rx_low_warning_dbm
        critical_low:
          field_name: rx_low_alarm_dbm
      policy_constraints:
        allowed_compare_modes:
        - threshold_and_deadband
        require_structured_threshold_references: true
        required_threshold_reference_any:
        - high
        - critical_high
        - low
        - critical_low
        minimum_hysteresis: 2
        deadband_bounds:
          min: 2
          max: 6
      event_constraints:
        allow_critical: true
        evidence_bound_roles: true
        role_event_types:
          low: OpticalRxPowerLow
          critical_low: OpticalRxPowerCritical
          high: OpticalRxPowerHigh
          critical_high: OpticalRxPowerHighCritical
          low_recovery: OpticalRxPowerRecovered
          high_recovery: OpticalRxPowerRecoveredFromHigh
        required_event_types:
        - OpticalRxPowerLow
        - OpticalRxPowerCritical
        - OpticalRxPowerHigh
        - OpticalRxPowerHighCritical
        - OpticalRxPowerRecovered
        - OpticalRxPowerRecoveredFromHigh
        required_event_classes:
          OpticalRxPowerLow: fault
          OpticalRxPowerCritical: fault
          OpticalRxPowerHigh: fault
          OpticalRxPowerHighCritical: fault
          OpticalRxPowerRecovered: recovery
          OpticalRxPowerRecoveredFromHigh: recovery
        required_severities:
          OpticalRxPowerLow: warning
          OpticalRxPowerCritical: critical
          OpticalRxPowerHigh: warning
          OpticalRxPowerHighCritical: critical
          OpticalRxPowerRecovered: info
          OpticalRxPowerRecoveredFromHigh: info
        required_exclusive_event_types:
        - OpticalRxPowerCritical
        priority_order:
        - higher: OpticalRxPowerCritical
          lower: OpticalRxPowerLow
        required_recovery_pairs:
        - fault: OpticalRxPowerLow
          recovery: OpticalRxPowerRecovered
        - fault: OpticalRxPowerCritical
          recovery: OpticalRxPowerRecovered
        - fault: OpticalRxPowerHigh
          recovery: OpticalRxPowerRecoveredFromHigh
        - fault: OpticalRxPowerHighCritical
          recovery: OpticalRxPowerRecoveredFromHigh
        max_rule_count: 7
      health_policy:
        revision: device-limits-with-directional-trends-v2
        baseline_mode: trend_only
        trend:
          kind: linear_power_drop
          threshold_ratio: 0.1
          identity_fields:
          - part_number
          - serial_number
          require_identity: false
        device_thresholds:
          high:
          - rx_high_warning_dbm
          - rx_high_alarm_dbm
          low:
          - rx_low_warning_dbm
          - rx_low_alarm_dbm
      change_tracking: false
      event_on_change: false
      assessment_roles:
      - evidence
    - observation_type: interface.optical.tx_power
      semantic_type: gauge
      unit: dbm
      canonical_field: tx_power_dbm
      dimensions:
      - channel
      value_type: number
      required: true
      required_when:
        field: transceiver_present
        equals: present
      mapping_guidance: Map only the current transmit optical-power measurement, not alarm or warning thresholds.
      context_fields:
      - part_number
      - serial_number
      threshold_references:
        high:
          field_name: tx_high_warning_dbm
        critical_high:
          field_name: tx_high_alarm_dbm
        low:
          field_name: tx_low_warning_dbm
        critical_low:
          field_name: tx_low_alarm_dbm
      policy_constraints:
