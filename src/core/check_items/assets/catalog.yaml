- id: environment.temperature
  version: 5
  name: Temperature sensor health
  category: environment
  description: Evaluate current sensor temperature against device-reported thresholds.
  result_mode: structured
  assessment_mode: health
  canonical_contract:
    entity_type: temperature_sensor
    identity_dimensions:
    - slot
    - sensor
    observations:
    - observation_type: environment.temperature.current
      semantic_type: gauge
      unit: celsius
      canonical_field: temperature_celsius
      mapping_guidance: Map the measured sensor value and evaluate it only against the warning/alarm thresholds reported for
        the same slot and sensor.
      threshold_references:
        high:
          field_name: temperature_high_warning_celsius
        critical_high:
          field_name: temperature_high_alarm_celsius
      policy_constraints:
        allowed_compare_modes:
        - threshold_and_deadband
        require_structured_threshold_references: true
        required_threshold_reference_any:
        - high
        - critical_high
        minimum_hysteresis: 2
      event_constraints:
        allow_critical: true
        role_event_types:
          high: TemperatureHigh
          critical_high: TemperatureCritical
          high_recovery: TemperatureRecovered
        required_event_types:
        - TemperatureHigh
        - TemperatureCritical
        - TemperatureRecovered
        required_event_classes:
          TemperatureHigh: fault
          TemperatureCritical: fault
          TemperatureRecovered: recovery
        required_severities:
          TemperatureHigh: warning
          TemperatureCritical: critical
          TemperatureRecovered: info
        required_recovery_pairs:
        - fault: TemperatureHigh
          recovery: TemperatureRecovered
        - fault: TemperatureCritical
          recovery: TemperatureRecovered
        max_rule_count: 3
    - observation_type: environment.temperature.warning
      semantic_type: threshold
      unit: celsius
      canonical_field: temperature_high_warning_celsius
      required: false
      change_tracking: false
      event_on_change: false
      assessment_roles:
      - evidence
    - observation_type: environment.temperature.alarm
      semantic_type: threshold
      unit: celsius
      canonical_field: temperature_high_alarm_celsius
      required: false
      change_tracking: false
      event_on_change: false
      assessment_roles:
      - evidence
    - canonical_field: sensor_status
      semantic_type: text
      value_type: text
      description: 设备报告的温度传感器状态；保留 Ok/Normal 等原文。
      required: false
      assessment_roles:
      - evidence
      ntc_values:
      - STATUS
      source_kind: ntc
      observation_type: environment.temperature.sensor_status
      event_on_change: false
      change_tracking: false
    - canonical_field: temperature_low_warning_celsius
      semantic_type: threshold
      value_type: number
      description: 设备明确报告的低温告警阈值；未输出时缺失。
      required: false
      assessment_roles:
      - evidence
      ntc_values: []
      source_kind: sample_cli
      unit: celsius
      observation_type: environment.temperature.temperature_low_warning_celsius
      event_on_change: false
      change_tracking: false
    - canonical_field: temperature_low_alarm_celsius
      semantic_type: threshold
      value_type: number
      description: 设备明确报告的低温严重告警阈值。
      required: false
      assessment_roles:
      - evidence
      ntc_values: []
      source_kind: sample_cli
      unit: celsius
      observation_type: environment.temperature.temperature_low_alarm_celsius
      event_on_change: false
      change_tracking: false
    reference_revision: cisco-samples-2026-09-23
    value_contract: same-name/v1
    record_semantics:
      reference_notes: MODULE/SENSOR 对应 slot/sensor；CURRENT_VALUE、MINOR_THRESHOLD、MAJOR_THRESHOLD 对应现有温度、warning 和 alarm。未知单位不自动当摄氏度。
      missing_values: 缺失与不支持不得补零；仅必填缺失导致不完整；可选字段无数据保留缺失。
    value_references:
