- id: huawei-interface-values
  version: 4
  name: Huawei display interface 同名字段
  description: ''
  check_item_ids:
  - interface.runtime_statistics
  match:
    vendors:
    - Huawei
    model_patterns:
    - ^X2E$
  commands:
  - command: display interface
    priority: 100
  collector: cli
  parser_requirement: structured
  template_scope: model
  adapter_spec:
    schema_version: command-adapter/v2
    parser:
      template_id: 7e1e92f2-b45d-54d2-9deb-fefd9be3380a
    outputs:
    - check_item_id: interface.runtime_statistics
      source_record_set: default
      empty_status: unavailable
      check_item_version_id: 525dc1a1-b596-57b2-bde9-5313146bfb90
      projection:
        fields:
          bandwidth_kbps:
            source: bandwidth_kbps
          description:
            source: description
          duplex:
            source: duplex
          hw_address:
            source: hw_address
          input_bytes:
            source: input_bytes
          input_crc_errors:
            source: input_crc_errors
          input_errors:
            source: input_errors
          input_packets:
            source: input_packets
          interface:
            source: interface
          l2mtu:
            source: l2mtu
          last_physical_down_time:
            source: last_physical_down_time
          last_physical_up_time:
            source: last_physical_up_time
          line_status:
            source: line_status
          loopback:
            source: loopback
          mtu:
            source: mtu
          negotiation:
            source: negotiation
          output_bytes:
            source: output_bytes
          output_errors:
            source: output_errors
          output_packets:
            source: output_packets
          port_link_type:
            source: port_link_type
          port_mode:
            source: port_mode
          protocol_status:
            source: protocol_status
          speed:
            source: speed
          vlan_native:
            source: vlan_native
  output_quality_policy:
    profile_version: 1
    minimum_non_whitespace_chars: 1
    unsupported_patterns:
    - '%\s*(?:invalid input|unrecognized command)'
    - error:\s*unrecognized command
    - (?:wrong|invalid) parameter found
    - unrecognized command found
    - incomplete command found
    command_error_patterns:
    - permission denied
    - authorization failed
    - insufficient privilege
    - command execution failed
    truncation_patterns:
    - (?im)^\s*(?:%|\[)?\s*output\s+(?:was\s+)?truncated\b
    - (?im)^\s*\[\s*truncated\s*\]\s*$
    - (?im)^\s*\.\.\.\s+(?:output\s+)?omitted\s+\.\.\.\s*$
    paging_patterns:
    - (?im)(?:--|----)\s*more\s*(?:--|----)
    - (?im)^\s*press\s+(?:any\s+key|space|enter)\s+to\s+continue
    - (?im)^\s*more:\s*<space>
  selection_priority: 200
  status: active
  digest: b8bfe04eee1c6b60991e170f9976d7c0c24ab0a2a309296a31f68536a7ab8085
  version_id: d2e58c5a-2be1-56f5-a15d-d34e16bbf95a
