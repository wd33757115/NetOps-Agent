catalog_version: 15
defaults:
  check_item:
    freshness_policy:
      max_observation_age: 24h
      max_collection_span: 8h
      clock_skew_tolerance: 10m
    empty_result_policy:
      classification: invalid
  implementation:
    output_quality_policy:
      profile_version: 1
      minimum_non_whitespace_chars: 1
      unsupported_patterns:
      - '%\s*(?:invalid input|unrecognized command)'
      - error:\s*unrecognized command
      - (?:wrong|invalid) parameter found
      - unrecognized command found
      - incomplete command found
      command_error_patterns:
      - permission denied
      - authorization failed
      - insufficient privilege
      - command execution failed
      truncation_patterns:
      - (?im)^\s*(?:%|\[)?\s*output\s+(?:was\s+)?truncated\b
      - (?im)^\s*\[\s*truncated\s*\]\s*$
      - (?im)^\s*\.\.\.\s+(?:output\s+)?omitted\s+\.\.\.\s*$
      paging_patterns:
      - (?im)(?:--|----)\s*more\s*(?:--|----)
      - (?im)^\s*press\s+(?:any\s+key|space|enter)\s+to\s+continue
      - (?im)^\s*more:\s*<space>
check_items:
- id: device.version
  version: 3
  name: Device version and inventory
  category: device
  description: Preserve software, platform and chassis identity for audit and comparison.
  result_mode: structured
  assessment_mode: evidence
  canonical_contract:
    entity_type: device
    identity_dimensions:
    - device_id
    observations:
    - observation_type: device.software.version
      semantic_type: state
      canonical_field: os_version
    - observation_type: device.hardware.model
      semantic_type: state
      canonical_field: model
    parser_field_vocabulary:
      hostname:
        aliases:
        - device_name
        role: context
      os_version:
        aliases:
        - version
        - software_version
        - nxos_version
        - system_version
        observation_type: device.software.version
        role: state
      software_release:
        aliases:
        - release
        role: state
      software_image:
        aliases:
        - image
        - system_image
        role: state
      boot_image:
        aliases:
        - running_image
        - bootfile
        role: state
      bootloader_version:
        aliases:
        - rommon_version
        - bootware_version
        role: state
      model:
        aliases:
        - platform
        - hardware_model
        observation_type: device.hardware.model
        role: state
      serial_number:
        aliases:
        - serial
        - serial_num
        - sn
        role: identity
      member:
        aliases:
        - switch_number
        - stack_member
        role: identity
      active_marker:
        aliases:
        - active
        - role_marker
        role: state
      uptime:
        role: context
      reload_reason:
        aliases:
        - last_reboot_reason
        role: state
  report_projection: device_inventory
  applicability: {}
  coverage_policy:
    model: fixed
    expected_count: 1
    require_rule_evaluation: false
  status: active
- id: system.cpu_usage
  version: 14
  name: CPU 使用率
  category: system
  description: Evaluate system, slot or processor CPU utilization.
  result_mode: structured
  assessment_mode: health
  canonical_contract:
    entity_type: cpu_scope
    identity_dimensions:
    - slot
    - cpu
    identity_dimension_rules:
      slot:
        kind: identifier
      cpu:
        kind: identifier
    value_contract: same-name/v1
    hardware_value_revision: hardware-values/v1
    observations:
    - canonical_field: cpu_5s_percent
      observation_type: system.cpu_usage.cpu_5s_percent
      semantic_type: gauge
      value_type: number
      unit: percent
      description: 明确标注 last 5 seconds 的 CPU 使用率
      required: false
      assessment_roles:
      - evidence
      dimensions: []
      fixed_dimensions:
        window: 5s
      change_tracking: false
      event_on_change: false
    - canonical_field: cpu_1m_percent
      observation_type: system.cpu_usage.cpu_1m_percent
      semantic_type: gauge
      value_type: number
      unit: percent
      description: 明确标注 last 1 minute 的 CPU 使用率
      required: false
      assessment_roles:
      - evidence
      dimensions: []
      fixed_dimensions:
        window: 1m
      change_tracking: false
      event_on_change: false
    - observation_type: device.cpu.utilization
      semantic_type: gauge
      unit: percent
      canonical_field: cpu_usage_percent
      dimensions: []
      policy_constraints:
        allowed_compare_modes:
        - threshold_and_deadband
        applies_to_dimensions:
          window:
          - 5m
        require_structured_threshold_references: true
        required_threshold_reference_any:
        - high
        - critical_high
        required_deadband: 5
        allowed_minimum_durations:
        - null
        - 0s
        evidence_only_reason: true
      event_constraints:
        role_event_types:
          high: CpuUtilizationHigh
          critical_high: CpuUtilizationCritical
          high_recovery: CpuUtilizationRecovered
        required_event_types:
        - CpuUtilizationHigh
        - CpuUtilizationCritical
        - CpuUtilizationRecovered
        required_event_classes:
          CpuUtilizationHigh: fault
          CpuUtilizationCritical: fault
          CpuUtilizationRecovered: recovery
        required_severities:
          CpuUtilizationHigh: warning
          CpuUtilizationCritical: critical
          CpuUtilizationRecovered: info
        allow_critical: true
        required_recovery_pairs:
        - fault: CpuUtilizationHigh
          recovery: CpuUtilizationRecovered
        - fault: CpuUtilizationCritical
          recovery: CpuUtilizationRecovered
        max_rule_count: 3
      threshold_references:
        high:
          field_name: cpu_high_warning_percent
        critical_high:
          field_name: cpu_high_alarm_percent
      health_policy:
        revision: device-limits-with-directional-trends-v2
        window: 5m
        baseline_mode: trend_only
        trend:
          kind: utilization_increase
          threshold_ratio: 0.1
          min_increase_points: 10
        device_thresholds:
          high:
          - cpu_high_warning_percent
          - cpu_high_alarm_percent
      required: true
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
      change_tracking: false
      event_on_change: false
      assessment_roles:
      - evidence
    - observation_type: device.cpu.high_warning
      semantic_type: threshold
      unit: percent
      canonical_field: cpu_high_warning_percent
      dimensions: []
      required: false
      assessment_roles:
      - reference
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
      change_tracking: false
      event_on_change: false
    - observation_type: device.cpu.high_alarm
      semantic_type: threshold
      unit: percent
      canonical_field: cpu_high_alarm_percent
      dimensions: []
      required: false
      assessment_roles:
      - reference
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
      change_tracking: false
      event_on_change: false
    - canonical_field: cpu_interrupt_5s_percent
      semantic_type: gauge
      value_type: number
      description: 五秒 CPU 使用率中的中断部分，不应再次加到总 CPU 使用率上。
      required: false
      assessment_roles:
      - evidence
      ntc_values:
      - CPU_INTERRUPTION_5_SEC
      source_kind: ntc
      unit: percent
      observation_type: system.cpu_usage.cpu_interrupt_5s_percent
      event_on_change: false
      change_tracking: false
    - canonical_field: cpu_user_percent
      semantic_type: gauge
      value_type: number
      description: NX-OS 当前 user 状态百分比，与五分钟平均值不同。
      required: false
      assessment_roles:
      - evidence
      ntc_values: []
      source_kind: sample_cli
      unit: percent
      observation_type: system.cpu_usage.cpu_user_percent
      event_on_change: false
      change_tracking: false
    - canonical_field: cpu_kernel_percent
      semantic_type: gauge
      value_type: number
      description: NX-OS 当前 kernel 状态百分比。
      required: false
      assessment_roles:
      - evidence
      ntc_values: []
      source_kind: sample_cli
      unit: percent
      observation_type: system.cpu_usage.cpu_kernel_percent
      event_on_change: false
      change_tracking: false
    - canonical_field: cpu_idle_percent
      semantic_type: gauge
      value_type: number
      description: NX-OS 当前 idle 百分比，不能直接写入五分钟 cpu_usage_percent。
      required: false
      assessment_roles:
      - evidence
      ntc_values: []
      source_kind: sample_cli
      unit: percent
      observation_type: system.cpu_usage.cpu_idle_percent
      event_on_change: false
      change_tracking: false
    reference_revision: cisco-samples-2026-09-23
    record_semantics:
      reference_notes: 保留已有5s/1m/5m 字段及设备阈值策略。NX-OS show system resources 未给五分钟使用率时，不用瞬时值冒充。
      missing_values: 缺失与不支持不得补零；仅必填缺失导致不完整；可选字段无数据保留缺失。
    value_references:
    - template: cisco_ios_show_processes_cpu.textfsm
      sha256: 580ba59ca0c2b0d09091fb0ccaca5cf2b618404e6b45f336f3bcafdb5bc3abe9
      values:
      - CPU_USAGE_5_SEC
      - CPU_INTERRUPTION_5_SEC
      - CPU_USAGE_1_MIN
      - CPU_USAGE_5_MIN
      - PROCESS_PID
      - PROCESS_RUNTIME
      - PROCESS_INVOKED
      - PROCESS_CPU_TIME_FOR_INVOCATION
      - PROCESS_CPU_USAGE_5_SEC
      - PROCESS_CPU_USAGE_1_MIN
      - PROCESS_CPU_USAGE_5_MIN
      - PROCESS_TTY
      - PROCESS_NAME
