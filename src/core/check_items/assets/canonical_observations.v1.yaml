catalog_id: netops.canonical-observations
catalog_version: 1
status: active

observation_types:
  - id: device.software.version
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.hardware.model
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.cpu.utilization
    semantic_type: gauge
    value_types: [number]
    canonical_unit: percent
    dimensions: [window]
    allowed_dimension_values:
      window: [instant, 5s, 1m, 5m, 15m]
    assessment_roles: [current_state, change]

  - id: device.memory.utilization
    semantic_type: gauge
    value_types: [number]
    canonical_unit: percent
    dimensions: []
    assessment_roles: [current_state, change]

  - id: device.memory.used
    semantic_type: gauge
    value_types: [number]
    canonical_unit: bytes
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.memory.total
    semantic_type: gauge
    value_types: [number]
    canonical_unit: bytes
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.oper_status
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: interface.admin_status
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.optical.presence
    semantic_type: state
    value_types: [boolean, text]
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.rx_power
    semantic_type: gauge
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.tx_power
    semantic_type: gauge
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.rx_low_warning
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.tx_low_warning
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: environment.fan.state
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: environment.power.state
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [current_state, change]
