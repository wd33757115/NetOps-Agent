catalog_version: 2

defaults:
  check_item:
    freshness_policy:
      max_observation_age: 24h
      max_collection_span: 8h
      clock_skew_tolerance: 10m
    empty_result_policy:
      classification: invalid
  implementation:
    output_quality_policy:
      profile_version: 1
      minimum_non_whitespace_chars: 1
      unsupported_patterns:
        - '%\s*(?:invalid input|unrecognized command)'
        - 'error:\s*unrecognized command'
        - '(?:wrong|invalid) parameter found'
        - 'unrecognized command found'
        - 'incomplete command found'
      command_error_patterns:
        - 'permission denied'
        - 'authorization failed'
        - 'insufficient privilege'
        - 'command execution failed'
      truncation_patterns:
        - '(?im)^\s*(?:%|\[)?\s*output\s+(?:was\s+)?truncated\b'
        - '(?im)^\s*\[\s*truncated\s*\]\s*$'
        - '(?im)^\s*\.\.\.\s+(?:output\s+)?omitted\s+\.\.\.\s*$'
      paging_patterns:
        - '(?im)(?:--|----)\s*more\s*(?:--|----)'
        - '(?im)^\s*press\s+(?:any\s+key|space|enter)\s+to\s+continue'
        - '(?im)^\s*more:\s*<space>'

check_items:
  - id: device.version
    version: 2
    name: Device version and inventory
    category: device
    description: Preserve software, platform and chassis identity for audit and comparison.
    result_mode: structured
    assessment_mode: evidence
    canonical_contract:
      entity_type: device
      identity_dimensions: [device_id]
      observations:
        - observation_type: device.software.version
          semantic_type: state
        - observation_type: device.hardware.model
          semantic_type: state
    report_projection: device_inventory
    applicability: {}
    coverage_policy:
      model: fixed
      expected_count: 1
      require_rule_evaluation: false
    status: active

  - id: system.cpu_usage
    version: 2
    name: CPU utilization
    category: system
    description: Evaluate system, slot or processor CPU utilization.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: cpu_scope
      identity_dimensions: [scope, scope_id]
      observations:
        - observation_type: device.cpu.utilization
          semantic_type: gauge
          unit: percent
          dimensions: [window]
    report_projection: cpu
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: system.memory_usage
    version: 2
    name: Memory utilization
    category: system
    description: Evaluate system or slot memory capacity and utilization.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: memory_scope
      identity_dimensions: [scope, scope_id]
      observations:
        - observation_type: device.memory.utilization
          semantic_type: gauge
          unit: percent
        - observation_type: device.memory.used
          semantic_type: gauge
          unit: bytes
        - observation_type: device.memory.total
          semantic_type: gauge
          unit: bytes
    report_projection: memory
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: interface.oper_status
    version: 2
    name: Interface operational status
    category: interface
    description: Evaluate current physical and protocol state for network interfaces.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: interface
      identity_dimensions: [interface]
      observations:
        - observation_type: interface.oper_status
          semantic_type: state
        - observation_type: interface.admin_status
          semantic_type: state
    report_projection: interface_status
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: interface.optical_power
    version: 2
    name: Interface optical power
    category: interface
    description: Evaluate transceiver presence and measured receive/transmit optical power.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: interface_optical
      identity_dimensions: [interface, channel]
      observations:
        - observation_type: interface.optical.presence
          semantic_type: state
        - observation_type: interface.optical.rx_power
          semantic_type: gauge
          unit: dbm
        - observation_type: interface.optical.tx_power
          semantic_type: gauge
          unit: dbm
        - observation_type: interface.optical.rx_low_warning
          semantic_type: threshold
          unit: dbm
        - observation_type: interface.optical.tx_low_warning
          semantic_type: threshold
          unit: dbm
    report_projection: optical_power
    applicability:
      capability: optical_diagnostics
      unknown_is: unable_to_determine
    empty_result_policy:
      classification: not_applicable
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: environment.fan
    version: 2
    name: Fan health
    category: environment
    description: Evaluate fan presence and operating state.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: environment_fan
      identity_dimensions: [slot, fan]
      observations:
        - observation_type: environment.fan.state
          semantic_type: state
    report_projection: fan
    applicability: {}
    empty_result_policy:
      classification: not_applicable
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: environment.power
    version: 2
    name: Power supply health
    category: environment
    description: Evaluate power-supply presence and operating state.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: environment_power
      identity_dimensions: [slot, power_supply]
      observations:
        - observation_type: environment.power.state
          semantic_type: state
    report_projection: power
    applicability: {}
    empty_result_policy:
      classification: not_applicable
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: configuration.running
    version: 2
    name: Running configuration change
    category: configuration
    description: Preserve and compare normalized running configuration evidence.
    result_mode: normalized_diff
    assessment_mode: change
    canonical_contract:
      entity_type: device_configuration
      identity_dimensions: [device_id]
      comparison_profile: configuration
    report_projection: configuration_change
    applicability: {}
    coverage_policy:
      model: fixed
      expected_count: 1
      require_rule_evaluation: false
    status: active

