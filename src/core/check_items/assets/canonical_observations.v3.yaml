catalog_id: netops.canonical-observations
catalog_version: 3
status: active

observation_types:
  - id: device.software.version
    description: Device operating-system software version as an inventory fact.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.hardware.model
    description: Device chassis or platform model as an inventory fact.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.cpu.utilization
    description: CPU utilization for one canonical CPU scope and time window.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: percent
    dimensions: [window]
    allowed_dimension_values:
      window: [instant, 5s, 1m, 5m, 15m]
    assessment_roles: [current_state, change]

  - id: device.cpu.high_warning
    description: Device-output or approved device-profile CPU warning threshold.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: percent
    dimensions: [window]
    assessment_roles: [reference]

  - id: device.cpu.high_alarm
    description: Device-output or approved device-profile CPU alarm threshold.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: percent
    dimensions: [window]
    assessment_roles: [reference]

  - id: device.memory.utilization
    description: Used memory as a percentage of total memory for one memory scope.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: percent
    dimensions: []
    assessment_roles: [current_state, change]

  - id: device.memory.high_warning
    description: Device-output or approved device-profile memory warning threshold.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: percent
    dimensions: []
    assessment_roles: [reference]

  - id: device.memory.high_alarm
    description: Device-output or approved device-profile memory alarm threshold.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: percent
    dimensions: []
    assessment_roles: [reference]

  - id: device.memory.used
    description: Used memory capacity for one memory scope.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: bytes
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.memory.total
    description: Total available memory capacity for one memory scope.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: bytes
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.oper_status
    description: Current forwarding or physical link operational state of an interface.
    semantic_type: state
    value_types: [text]
    allowed_values:
      [up, down, admin_down, absent, error_disabled, unavailable, unknown]
    state_groups:
      healthy: [up]
      unhealthy: [down, error_disabled, unavailable]
      suppressed: [admin_down, absent]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: interface.admin_status
    description: Explicit configured administrative enable or shutdown state; protocol state is not administrative state.
    semantic_type: state
    value_types: [text]
    allowed_values: [up, down, unknown]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.optical.presence
    description: Whether an optical transceiver is physically present and diagnosable on the interface channel.
    semantic_type: state
    value_types: [boolean, text]
    allowed_values: [present, absent, unknown]
    state_groups:
      healthy: [present]
      unhealthy: [absent]
      unknown: [unknown]
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.rx_power
    description: Current received optical power measurement for one interface channel.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.tx_power
    description: Current transmitted optical power measurement for one interface channel.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [current_state, change]

  - id: interface.optical.rx_low_warning
    description: Device-reported low receive-power warning threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.rx_low_alarm
    description: Device-reported low receive-power alarm threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.rx_high_warning
    description: Device-reported high receive-power warning threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.rx_high_alarm
    description: Device-reported high receive-power alarm threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.tx_low_warning
    description: Device-reported low transmit-power warning threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.tx_low_alarm
    description: Device-reported low transmit-power alarm threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.tx_high_warning
    description: Device-reported high transmit-power warning threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.tx_high_alarm
    description: Device-reported high transmit-power alarm threshold for one interface channel.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: dbm
    dimensions: [channel]
    assessment_roles: [reference]

  - id: interface.optical.part_number
    description: Optical transceiver manufacturer part number used to bind baselines.
    semantic_type: state
    value_types: [text]
    dimensions: [channel]
    assessment_roles: [evidence]

  - id: interface.optical.serial_number
    description: Optical transceiver serial number used to bind baselines.
    semantic_type: state
    value_types: [text]
    dimensions: [channel]
    assessment_roles: [evidence]

  - id: environment.fan.state
    description: Current presence and operating health state of one fan.
    semantic_type: state
    value_types: [text]
    allowed_values: [normal, up, down, failed, absent, unknown]
    state_groups:
      healthy: [normal, up]
      unhealthy: [down, failed, absent]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: environment.power.state
    description: Current presence and operating health state of one power supply.
    semantic_type: state
    value_types: [text]
    allowed_values: [normal, up, down, failed, absent, unknown]
    state_groups:
      healthy: [normal, up]
      unhealthy: [down, failed, absent]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: device.hardware.serial_number
    description: Manufacturer serial number for one device hardware component.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.hardware.vendor
    description: Manufacturer identity reported for one device hardware component.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: device.module.oper_status
    description: Current operating health of one replaceable device module or line card.
    semantic_type: state
    value_types: [text]
    allowed_values: [up, down, degraded, absent, unknown]
    state_groups:
      healthy: [up]
      unhealthy: [down, degraded, absent]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: environment.temperature.current
    description: Current temperature reported by one device sensor.
    semantic_type: gauge
    value_types: [number]
    canonical_unit: celsius
    dimensions: []
    assessment_roles: [current_state, change]

  - id: environment.temperature.warning
    description: Device-reported warning threshold for one temperature sensor.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: celsius
    dimensions: []
    assessment_roles: [reference]

  - id: environment.temperature.alarm
    description: Device-reported alarm threshold for one temperature sensor.
    semantic_type: threshold
    value_types: [number]
    canonical_unit: celsius
    dimensions: []
    assessment_roles: [reference]

  - id: interface.statistics.input_errors
    description: Cumulative input error counter for one interface.
    semantic_type: counter
    value_types: [number]
    canonical_unit: count
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.statistics.output_errors
    description: Cumulative output error counter for one interface.
    semantic_type: counter
    value_types: [number]
    canonical_unit: count
    dimensions: []
    assessment_roles: [change, evidence]

  - id: interface.ip.address
    description: IP address assigned to one interface and address family.
    semantic_type: state
    value_types: [text]
    dimensions: [address_family]
    allowed_dimension_values:
      address_family: [ipv4, ipv6]
    assessment_roles: [change, evidence]

  - id: redundancy.vrrp.state
    description: Current operational role of one VRRP instance.
    semantic_type: state
    value_types: [text]
    allowed_values: [master, backup, initialize, inactive, unknown]
    state_groups:
      healthy: [master, backup]
      transitional: [initialize]
      unhealthy: [inactive]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: redundancy.stack.member_state
    description: Current membership and operating state of one stack or IRF member.
    semantic_type: state
    value_types: [text]
    allowed_values: [active, ready, normal, standby, down, failed, absent, unknown]
    state_groups:
      healthy: [active, ready, normal, standby]
      unhealthy: [down, failed, absent]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: redundancy.mlag.state
    description: Current operating state of one multi-chassis link aggregation domain.
    semantic_type: state
    value_types: [text]
    allowed_values: [active, up, normal, down, degraded, failed, unknown]
    state_groups:
      healthy: [active, up, normal]
      unhealthy: [down, degraded, failed]
      unknown: [unknown]
    dimensions: []
    assessment_roles: [current_state, change]

  - id: network.vrf.status
    description: Presence or operating status of one virtual routing and forwarding instance.
    semantic_type: state
    value_types: [text]
    allowed_values: [present, active, inactive, unknown]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: network.arp.mac_address
    description: MAC address currently bound to one IP address in an ARP table.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]

  - id: network.mac_table.interface
    description: Interface currently associated with one VLAN and MAC address.
    semantic_type: state
    value_types: [text]
    dimensions: []
    assessment_roles: [change, evidence]
