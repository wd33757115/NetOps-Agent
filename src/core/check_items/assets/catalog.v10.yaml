catalog_version: 10

defaults:
  check_item:
    freshness_policy:
      max_observation_age: 24h
      max_collection_span: 8h
      clock_skew_tolerance: 10m
    empty_result_policy:
      classification: invalid
  implementation:
    output_quality_policy:
      profile_version: 1
      minimum_non_whitespace_chars: 1
      unsupported_patterns:
        - '%\s*(?:invalid input|unrecognized command)'
        - 'error:\s*unrecognized command'
        - '(?:wrong|invalid) parameter found'
        - 'unrecognized command found'
        - 'incomplete command found'
      command_error_patterns:
        - 'permission denied'
        - 'authorization failed'
        - 'insufficient privilege'
        - 'command execution failed'
      truncation_patterns:
        - '(?im)^\s*(?:%|\[)?\s*output\s+(?:was\s+)?truncated\b'
        - '(?im)^\s*\[\s*truncated\s*\]\s*$'
        - '(?im)^\s*\.\.\.\s+(?:output\s+)?omitted\s+\.\.\.\s*$'
      paging_patterns:
        - '(?im)(?:--|----)\s*more\s*(?:--|----)'
        - '(?im)^\s*press\s+(?:any\s+key|space|enter)\s+to\s+continue'
        - '(?im)^\s*more:\s*<space>'

check_items:
  - id: device.version
    version: 3
    name: Device version and inventory
    category: device
    description: Preserve software, platform and chassis identity for audit and comparison.
    result_mode: structured
    assessment_mode: evidence
    canonical_contract:
      entity_type: device
      identity_dimensions: [device_id]
      observations:
        - observation_type: device.software.version
          semantic_type: state
          canonical_field: os_version
        - observation_type: device.hardware.model
          semantic_type: state
          canonical_field: model
      parser_field_vocabulary:
        hostname:
          aliases: [device_name]
          role: context
        os_version:
          aliases: [version, software_version, nxos_version, system_version]
          observation_type: device.software.version
          role: state
        software_release:
          aliases: [release]
          role: state
        software_image:
          aliases: [image, system_image]
          role: state
        boot_image:
          aliases: [running_image, bootfile]
          role: state
        bootloader_version:
          aliases: [rommon_version, bootware_version]
          role: state
        model:
          aliases: [platform, hardware_model]
          observation_type: device.hardware.model
          role: state
        serial_number:
          aliases: [serial, serial_num, sn]
          role: identity
        member:
          aliases: [switch_number, stack_member]
          role: identity
        active_marker:
          aliases: [active, role_marker]
          role: state
        uptime:
          role: context
        reload_reason:
          aliases: [last_reboot_reason]
          role: state
    report_projection: device_inventory
    applicability: {}
    coverage_policy:
      model: fixed
      expected_count: 1
      require_rule_evaluation: false
    status: active

  - id: system.cpu_usage
    version: 9
    name: CPU utilization
    category: system
    description: Evaluate system, slot or processor CPU utilization.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: cpu_scope
      identity_dimensions: [scope, scope_id]
      identity_dimension_rules:
        scope:
          kind: enum
          allowed_values: [system, slot, processor]
        scope_id:
          kind: identifier
      observations:
        - observation_type: device.cpu.utilization
          semantic_type: gauge
          unit: percent
          canonical_field: cpu_usage_percent
          dimensions: [window]
          mapping_guidance: Map a directly measured CPU utilization value, or derive it as 100 minus an explicit idle percentage. Preserve the actual source interval in window; current CPU state is instant and must never be labelled 5m.
          projection_recipes:
            - id: utilization_from_idle_percent
              bindings:
                idle:
                  canonical_fields: [cpu_idle_percent]
              anchor: idle
              transform:
                op: subtract
                args:
                  - literal: 100
                  - binding: idle
              dimensions:
                window: instant
          policy_constraints:
            allowed_compare_modes: [threshold_and_deadband]
            applies_to_dimensions:
              window: [5m]
            require_structured_threshold_references: true
            required_threshold_reference_any: [high, critical_high]
            required_deadband: 5
            allowed_minimum_durations: [null, 0s]
            evidence_only_reason: true
          event_constraints:
            role_event_types:
              high: CpuUtilizationHigh
              critical_high: CpuUtilizationCritical
              high_recovery: CpuUtilizationRecovered
            required_event_types: [CpuUtilizationHigh, CpuUtilizationCritical, CpuUtilizationRecovered]
            required_event_classes:
              CpuUtilizationHigh: fault
              CpuUtilizationCritical: fault
              CpuUtilizationRecovered: recovery
            required_severities:
              CpuUtilizationHigh: warning
              CpuUtilizationCritical: critical
              CpuUtilizationRecovered: info
            allow_critical: true
            required_recovery_pairs:
              - fault: CpuUtilizationHigh
                recovery: CpuUtilizationRecovered
              - fault: CpuUtilizationCritical
                recovery: CpuUtilizationRecovered
            max_rule_count: 3
          threshold_references:
            high:
              field_name: cpu_high_warning_percent
            critical_high:
              field_name: cpu_high_alarm_percent
        - observation_type: device.cpu.high_warning
          semantic_type: threshold
          unit: percent
          canonical_field: cpu_high_warning_percent
          dimensions: [window]
          required: false
          assessment_roles: [reference]
        - observation_type: device.cpu.high_alarm
          semantic_type: threshold
          unit: percent
          canonical_field: cpu_high_alarm_percent
          dimensions: [window]
          required: false
          assessment_roles: [reference]
      parser_field_vocabulary:
        cpu_usage_percent:
          aliases: [cpu_usage, cpu_percent, total_cpu_percent]
          observation_type: device.cpu.utilization
          role: metric
        cpu_idle_percent:
          aliases: [idle_percent, aggregate_cpu_idle_percent]
          role: metric
        cpu_high_warning_percent:
          aliases: [cpu_warning_threshold, cpu_high_warning]
          observation_type: device.cpu.high_warning
          role: threshold
        cpu_high_alarm_percent:
          aliases: [cpu_alarm_threshold, cpu_high_alarm]
          observation_type: device.cpu.high_alarm
          role: threshold
        cpu_5s:
          aliases: [cpu_usage_5_sec, total_cpu_pct_5s]
          observation_type: device.cpu.utilization
          role: metric
        cpu_1m:
          aliases: [cpu_usage_1_min, total_cpu_pct_1m]
          observation_type: device.cpu.utilization
          role: metric
        cpu_5m:
          aliases: [cpu_usage_5_min, total_cpu_pct_5m]
          observation_type: device.cpu.utilization
          role: metric
        cpu_interrupt_5s:
          aliases: [cpu_interruption_5_sec, interrupt_cpu_pct_5s]
          role: metric
        process_id:
          aliases: [process_pid, pid]
          role: identity
        process_name:
          aliases: [process]
          role: context
        process_runtime_ms:
          aliases: [process_runtime]
          role: metric
        process_invocation_count:
          aliases: [process_invoked]
          role: metric
        process_usec_per_invocation:
          aliases: [process_cpu_time_for_invocation]
          role: metric
        process_cpu_5s:
          aliases: [process_cpu_usage_5_sec, cpu_pct_5s]
          role: metric
        process_cpu_1m:
          aliases: [process_cpu_usage_1_min, cpu_pct_1m]
          role: metric
        process_cpu_5m:
          aliases: [process_cpu_usage_5_min, cpu_pct_5m]
          role: metric
        process_tty:
          aliases: [tty]
          role: context
    report_projection: cpu
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: system.memory_usage
    version: 7
    name: Memory utilization
    category: system
    description: Evaluate system or slot memory capacity and utilization.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: memory_scope
      identity_dimensions: [scope, scope_id]
      identity_dimension_rules:
        scope:
          kind: enum
          allowed_values: [system, slot, processor]
        scope_id:
          kind: identifier
      observations:
        - observation_type: device.memory.utilization
          semantic_type: gauge
          unit: percent
          canonical_field: memory_usage_percent
          mapping_guidance: Map a directly measured memory utilization percentage, or derive it as 100 multiplied by used memory divided by total memory when both values are present and use compatible units.
          projection_recipes:
            - id: utilization_from_used_and_total
              bindings:
                used:
                  canonical_fields: [memory_used_bytes]
                total:
                  canonical_fields: [memory_total_bytes]
                free:
                  canonical_fields: [memory_free_bytes]
              anchor: free
              transform:
                op: multiply
                args:
                  - literal: 100
                  - op: divide
                    args:
                      - binding: used
                      - binding: total
          policy_constraints:
            allowed_compare_modes: [threshold_and_deadband]
            require_structured_threshold_references: true
            required_threshold_reference_any: [high, critical_high]
            required_deadband: 5
            allowed_minimum_durations: [null, 0s]
          event_constraints:
            role_event_types:
              high: MemoryUtilizationHigh
              critical_high: MemoryUtilizationCritical
              high_recovery: MemoryUtilizationRecovered
            required_event_types: [MemoryUtilizationHigh, MemoryUtilizationCritical, MemoryUtilizationRecovered]
            required_event_classes:
              MemoryUtilizationHigh: fault
              MemoryUtilizationCritical: fault
              MemoryUtilizationRecovered: recovery
            required_severities:
              MemoryUtilizationHigh: warning
              MemoryUtilizationCritical: critical
              MemoryUtilizationRecovered: info
            allow_critical: true
            required_recovery_pairs:
              - fault: MemoryUtilizationHigh
                recovery: MemoryUtilizationRecovered
              - fault: MemoryUtilizationCritical
                recovery: MemoryUtilizationRecovered
            max_rule_count: 3
          threshold_references:
            high:
              field_name: memory_high_warning_percent
            critical_high:
              field_name: memory_high_alarm_percent
        - observation_type: device.memory.used
          semantic_type: gauge
          unit: bytes
          canonical_field: memory_used_bytes
          assessment_roles: [evidence]
          mapping_guidance: Map the measured used-memory capacity and normalize its declared source unit to bytes.
        - observation_type: device.memory.total
          semantic_type: gauge
          unit: bytes
          canonical_field: memory_total_bytes
          assessment_roles: [evidence]
          mapping_guidance: Map the measured total-memory capacity and normalize its declared source unit to bytes.
        - observation_type: device.memory.high_warning
          semantic_type: threshold
          unit: percent
          canonical_field: memory_high_warning_percent
          required: false
          assessment_roles: [reference]
        - observation_type: device.memory.high_alarm
          semantic_type: threshold
          unit: percent
          canonical_field: memory_high_alarm_percent
          required: false
          assessment_roles: [reference]
      parser_field_vocabulary:
        memory_pool:
          aliases: [pool]
          role: identity
        memory_total_bytes:
          aliases: [total_bytes, total]
          observation_type: device.memory.total
          role: metric
        memory_used_bytes:
          aliases: [used_bytes, used]
          observation_type: device.memory.used
          role: metric
        memory_free_bytes:
          aliases: [free_bytes, free]
          role: metric
        memory_usage_percent:
          aliases: [usage, usage_percent, memory_usage]
          observation_type: device.memory.utilization
          role: metric
        memory_high_warning_percent:
          aliases: [memory_warning_threshold, memory_high_warning]
          observation_type: device.memory.high_warning
          role: threshold
        memory_high_alarm_percent:
          aliases: [memory_alarm_threshold, memory_high_alarm]
          observation_type: device.memory.high_alarm
          role: threshold
        process_id:
          aliases: [process_pid, pid]
          role: identity
        process_name:
          aliases: [process]
          role: context
        process_allocated_bytes:
          aliases: [allocated_bytes]
          role: metric
        process_freed_bytes:
          aliases: [freed_bytes]
          role: metric
        process_holding_bytes:
          aliases: [holding_bytes]
          role: metric
        process_buffer_get_count:
          aliases: [buffer_get_count]
          role: metric
        process_buffer_return_count:
          aliases: [buffer_return_count]
          role: metric
        process_tty:
          aliases: [tty]
          role: context
    report_projection: memory
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: interface.oper_status
    version: 6
    name: Interface operational status
    category: interface
    description: Evaluate current physical and protocol state for network interfaces.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: interface
      identity_dimensions: [interface]
      observations:
        - observation_type: interface.oper_status
          semantic_type: state
          canonical_field: oper_status
          required: true
          mapping_guidance: Map the physical or forwarding operational state reported for the interface.
          policy_constraints:
            allowed_compare_modes: [state_transition, enum_transition]
          event_constraints:
            role_event_types:
              down: InterfaceDown
              up: InterfaceUp
            required_event_types: [InterfaceDown, InterfaceUp]
            required_event_classes:
              InterfaceDown: fault
              InterfaceUp: recovery
            required_condition_kinds:
              InterfaceDown: transition
              InterfaceUp: transition
            required_severities:
              InterfaceDown: major
              InterfaceUp: info
            required_recovery_pairs:
              - fault: InterfaceDown
                recovery: InterfaceUp
            allow_initial_transition_fault: false
            max_rule_count: 2
        - observation_type: interface.admin_status
          semantic_type: state
          canonical_field: admin_status
          required: false
          mapping_guidance: Map only an explicit configured administrative enable or shutdown field; never infer it from protocol or link state.
      parser_field_vocabulary:
        interface:
          aliases: [port, interface_id, interface_name]
          role: identity
        oper_status:
          aliases: [status, link_status, physical_status, interface_status]
          observation_type: interface.oper_status
          role: state
        admin_status:
          aliases: [administrative_status, admin_state]
          observation_type: interface.admin_status
          role: state
        protocol_status:
          aliases: [protocol, line_protocol]
          role: state
        description:
          aliases: [name, interface_description]
          role: context
        vlan_id:
          aliases: [vlan]
          role: context
          value_type: text
        duplex:
          role: context
        speed_raw:
          aliases: [speed]
          role: context
          value_type: text
        media_type:
          aliases: [type, transceiver_type]
          role: context
    report_projection: interface_status
    applicability: {}
    coverage_policy:
      model: derived_entity_set
      source: previous_qualified_observation
      first_observation: unable_to_determine
    status: active

  - id: interface.optical_power
    version: 11
    name: Interface optical power
    category: interface
    description: Evaluate transceiver presence and measured receive/transmit optical power.
    result_mode: structured
    assessment_mode: health
    canonical_contract:
      entity_type: interface_optical
      identity_dimensions: [interface, channel]
      observations:
        - observation_type: interface.optical.presence
          semantic_type: state
          canonical_field: transceiver_present
          dimensions: [channel]
          required: true
          mapping_guidance: Map explicit presence/absence evidence; an empty source status may mean present only when samples prove that convention.
          policy_constraints:
            allowed_compare_modes: [state_transition, enum_transition]
          event_constraints:
            role_event_types:
              down: TransceiverAbsent
              up: TransceiverRestored
            required_event_types: [TransceiverAbsent, TransceiverRestored]
            required_event_classes:
              TransceiverAbsent: fault
              TransceiverRestored: recovery
            required_severities:
              TransceiverAbsent: major
              TransceiverRestored: info
            required_recovery_pairs:
              - fault: TransceiverAbsent
                recovery: TransceiverRestored
            max_rule_count: 2
        - observation_type: interface.optical.rx_power
          semantic_type: gauge
          unit: dbm
          canonical_field: rx_power_dbm
          dimensions: [channel]
          value_type: number
          required: true
          required_when:
            field: transceiver_present
            equals: present
          mapping_guidance: Map only the current receive optical-power measurement, not alarm or warning thresholds.
          context_fields: [part_number, serial_number]
          threshold_references:
            high: {field_name: rx_high_warning_dbm}
            critical_high: {field_name: rx_high_alarm_dbm}
            low: {field_name: rx_low_warning_dbm}
            critical_low: {field_name: rx_low_alarm_dbm}
          baseline_comparison:
            kind: linear_power_loss_ratio
            max_loss_ratio: 0.10
            identity_fields: [part_number, serial_number]
          policy_constraints:
            allowed_compare_modes: [threshold_and_deadband]
            require_structured_threshold_references: true
            required_threshold_reference_any: [high, critical_high, low, critical_low]
            minimum_hysteresis: 2
            deadband_bounds: {min: 2, max: 6}
          event_constraints:
            allow_critical: true
            evidence_bound_roles: true
            role_event_types:
              low: OpticalRxPowerLow
              critical_low: OpticalRxPowerCritical
              high: OpticalRxPowerHigh
              critical_high: OpticalRxPowerHighCritical
              low_recovery: OpticalRxPowerRecovered
              high_recovery: OpticalRxPowerRecoveredFromHigh
              baseline_degradation: OpticalRxPowerDegraded
            required_event_types:
              - OpticalRxPowerLow
              - OpticalRxPowerCritical
              - OpticalRxPowerHigh
              - OpticalRxPowerHighCritical
              - OpticalRxPowerDegraded
              - OpticalRxPowerRecovered
              - OpticalRxPowerRecoveredFromHigh
            required_event_classes:
              OpticalRxPowerLow: fault
              OpticalRxPowerCritical: fault
              OpticalRxPowerHigh: fault
              OpticalRxPowerHighCritical: fault
              OpticalRxPowerDegraded: fault
              OpticalRxPowerRecovered: recovery
              OpticalRxPowerRecoveredFromHigh: recovery
            required_severities:
              OpticalRxPowerLow: warning
              OpticalRxPowerCritical: critical
              OpticalRxPowerHigh: warning
              OpticalRxPowerHighCritical: critical
              OpticalRxPowerDegraded: warning
              OpticalRxPowerRecovered: info
              OpticalRxPowerRecoveredFromHigh: info
            required_exclusive_event_types:
              - OpticalRxPowerCritical
            priority_order:
              - higher: OpticalRxPowerCritical
                lower: OpticalRxPowerLow
            required_recovery_pairs:
              - fault: OpticalRxPowerLow
                recovery: OpticalRxPowerRecovered
              - fault: OpticalRxPowerCritical
                recovery: OpticalRxPowerRecovered
              - fault: OpticalRxPowerHigh
                recovery: OpticalRxPowerRecoveredFromHigh
              - fault: OpticalRxPowerHighCritical
                recovery: OpticalRxPowerRecoveredFromHigh
            max_rule_count: 7
        - observation_type: interface.optical.tx_power
          semantic_type: gauge
          unit: dbm
          canonical_field: tx_power_dbm
          dimensions: [channel]
          value_type: number
          required: true
          required_when:
            field: transceiver_present
            equals: present
          mapping_guidance: Map only the current transmit optical-power measurement, not alarm or warning thresholds.
          context_fields: [part_number, serial_number]
          threshold_references:
            high: {field_name: tx_high_warning_dbm}
            critical_high: {field_name: tx_high_alarm_dbm}
            low: {field_name: tx_low_warning_dbm}
            critical_low: {field_name: tx_low_alarm_dbm}
          baseline_comparison:
            kind: linear_power_loss_ratio
            max_loss_ratio: 0.10
            identity_fields: [part_number, serial_number]
          policy_constraints:
            allowed_compare_modes: [threshold_and_deadband]
            require_structured_threshold_references: true
            required_threshold_reference_any: [high, critical_high, low, critical_low]
            minimum_hysteresis: 2
            deadband_bounds: {min: 2, max: 6}
          event_constraints:
            allow_critical: true
            evidence_bound_roles: true
            role_event_types:
              low: OpticalTxPowerLow
              critical_low: OpticalTxPowerCritical
              high: OpticalTxPowerHigh
              critical_high: OpticalTxPowerHighCritical
              low_recovery: OpticalTxPowerRecovered
              high_recovery: OpticalTxPowerRecoveredFromHigh
              baseline_degradation: OpticalTxPowerDegraded
            required_event_types:
              - OpticalTxPowerLow
              - OpticalTxPowerCritical
              - OpticalTxPowerHigh
              - OpticalTxPowerHighCritical
              - OpticalTxPowerDegraded
              - OpticalTxPowerRecovered
              - OpticalTxPowerRecoveredFromHigh
            required_event_classes:
              OpticalTxPowerLow: fault
              OpticalTxPowerCritical: fault
              OpticalTxPowerHigh: fault
              OpticalTxPowerHighCritical: fault
              OpticalTxPowerDegraded: fault
              OpticalTxPowerRecovered: recovery
              OpticalTxPowerRecoveredFromHigh: recovery
            required_severities:
              OpticalTxPowerLow: warning
              OpticalTxPowerCritical: critical
              OpticalTxPowerHigh: warning
              OpticalTxPowerHighCritical: critical
              OpticalTxPowerDegraded: warning
              OpticalTxPowerRecovered: info
              OpticalTxPowerRecoveredFromHigh: info
            required_exclusive_event_types:
              - OpticalTxPowerCritical
            priority_order:
              - higher: OpticalTxPowerCritical
                lower: OpticalTxPowerLow
            required_recovery_pairs:
              - fault: OpticalTxPowerLow
                recovery: OpticalTxPowerRecovered
              - fault: OpticalTxPowerCritical
                recovery: OpticalTxPowerRecovered
              - fault: OpticalTxPowerHigh
                recovery: OpticalTxPowerRecoveredFromHigh
              - fault: OpticalTxPowerHighCritical
                recovery: OpticalTxPowerRecoveredFromHigh
            max_rule_count: 7
        - {observation_type: interface.optical.rx_high_alarm, semantic_type: threshold, unit: dbm, canonical_field: rx_high_alarm_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.rx_high_warning, semantic_type: threshold, unit: dbm, canonical_field: rx_high_warning_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.rx_low_warning, semantic_type: threshold, unit: dbm, canonical_field: rx_low_warning_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.rx_low_alarm, semantic_type: threshold, unit: dbm, canonical_field: rx_low_alarm_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.tx_high_alarm, semantic_type: threshold, unit: dbm, canonical_field: tx_high_alarm_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.tx_high_warning, semantic_type: threshold, unit: dbm, canonical_field: tx_high_warning_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.tx_low_warning, semantic_type: threshold, unit: dbm, canonical_field: tx_low_warning_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.tx_low_alarm, semantic_type: threshold, unit: dbm, canonical_field: tx_low_alarm_dbm, dimensions: [channel], required: false, assessment_roles: [reference]}
        - {observation_type: interface.optical.part_number, semantic_type: state, canonical_field: part_number, dimensions: [channel], required: false, assessment_roles: [evidence]}
        - {observation_type: interface.optical.serial_number, semantic_type: state, canonical_field: serial_number, dimensions: [channel], required: false, assessment_roles: [evidence]}
      parser_field_vocabulary:
        interface:
          aliases: [port, interface_id, interface_name]
          role: identity
          value_type: interface_name
        channel:
          aliases: [lane]
          role: identity
        transceiver_present:
          aliases: [present, presence, transceiver_status]
          observation_type: interface.optical.presence
          role: state
        rx_power_dbm:
          aliases: [rx_power, receive_power, receive_power_dbm]
          observation_type: interface.optical.rx_power
          role: metric
        rx_high_alarm_dbm:
          aliases: [rx_power_high_alarm, rx_high_alarm]
          role: threshold
        rx_high_warning_dbm:
          aliases: [rx_power_high_warning, rx_high_warning]
          role: threshold
        rx_low_warning_dbm:
          aliases: [rx_power_low_warning, rx_low_warning]
          role: threshold
        rx_low_alarm_dbm:
          aliases: [rx_power_low_alarm, rx_low_alarm]
          role: threshold
        tx_power_dbm:
          aliases: [tx_power, transmit_power, transmit_power_dbm]
          observation_type: interface.optical.tx_power
          role: metric
        tx_high_alarm_dbm:
          aliases: [tx_power_high_alarm, tx_high_alarm]
          role: threshold
        tx_high_warning_dbm:
          aliases: [tx_power_high_warning, tx_high_warning]
          role: threshold
        tx_low_warning_dbm:
          aliases: [tx_power_low_warning, tx_low_warning]
          role: threshold
        tx_low_alarm_dbm:
          aliases: [tx_power_low_alarm, tx_low_alarm]
          role: threshold
