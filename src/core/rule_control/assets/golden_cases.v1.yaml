# LLM 规则生成质量回归集（golden dataset）v1
#
# 每个用例给出脱敏后的生成上下文（context）与"标准答案期望"（expectations）。
# 期望不是逐字匹配，而是可判定的质量断言：阈值必须落在合理区间、事件规则
# 必须覆盖指定 severity/条件字段等——用于挡住"平庸"的产物（如阈值全设宽松
# 值导致永不告警）。模型或 Prompt 变更时运行:
#   python scripts/test/run_rule_golden_regression.py
version: 1
cases:
  - id: huawei-interface-crc-gauge
    stage: change_policy
    description: 华为接口 CRC 错误计数应生成敏感的 gauge 策略而不是永不告警的宽松阈值
    context:
      command: display interface
      vendor: huawei
      observation_type: interface_error_metric
      field_name: crc_errors
      field_semantics:
        semantic_type: counter
        observation_type: interface_error_metric
        unit: packets
      records:
        - { interface: GE1/0/1, crc_errors: 0, input_errors: 0 }
        - { interface: GE1/0/2, crc_errors: 3, input_errors: 1 }
        - { interface: GE1/0/3, crc_errors: 0, input_errors: 0 }
      historical_values: [0, 0, 0, 1, 2, 3, 0, 0, 5, 0, 0, 0]
    expectations:
      semantic_type: counter
      compare_mode_one_of: [delta, numeric_delta, threshold]
      thresholds:
        # 历史值 P99 ≈ 5；任何 key 的阈值超过 50 即视为"永不告警"的平庸阈值
        max_allowed: 50
        min_required_keys: 1
      forbid_empty_thresholds: true

  - id: huawei-fan-status-enum
    stage: change_policy
    description: 风扇状态枚举字段应生成 enum/equality 比较而不是数值阈值
    context:
      command: display fan
      vendor: huawei
      observation_type: fan_status
      field_name: status
      field_semantics:
        semantic_type: enum
        observation_type: fan_status
        healthy_values: [Normal]
      records:
        - { slot: "1", status: Normal }
        - { slot: "2", status: Normal }
        - { slot: "3", status: Abnormal }
    expectations:
      semantic_type: enum
      compare_mode_one_of: [equality, enum, value_change]
      thresholds:
        max_required_keys: 0

  - id: cisco-version-event-rules
    stage: event_rules
    description: 软件版本变化必须产出至少一条可触发的高严重度事件规则
    context:
      command: show version
      vendor: cisco
      observation_type: software_version
      field_name: version
      field_semantics:
        semantic_type: identity_change
        observation_type: software_version
      records:
        - { hostname_alias: dev-a, version: 15.2(4)M7 }
        - { hostname_alias: dev-b, version: 15.2(4)M7 }
    expectations:
      min_rule_count: 1
      severities_at_least_one_of: [critical, error, warning]
      required_condition_fields: [observation_type]
      forbid_all_severity: [info]

  - id: h3c-interface-contract
    stage: observation_contract
    description: 接口表实体必须以接口名为主键并保留关键错误计数字段
    context:
      command: display interface brief
      vendor: h3c
      records:
        - { interface: GE1/0/1, link_status: UP, crc_errors: 0 }
        - { interface: GE1/0/2, link_status: DOWN, crc_errors: 12 }
    expectations:
      primary_keys_include_any: [interface, port, name]
      required_fields_include_any: [link_status, crc_errors]
