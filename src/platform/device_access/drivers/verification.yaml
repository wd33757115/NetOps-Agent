    vendor: H3C
    model: VSR1000
    os_version: "7.1.064 Release 1362P12"
    date: "2026-09-28"
    drivers:
      paramiko: "4.0.0"
      netmiko: "4.7.0"
    device_count: 2
    initialization:
      - screen-length disable
    commands:
      - display version
      - display interface brief
