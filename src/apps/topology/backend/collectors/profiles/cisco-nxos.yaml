schema_version: 1
id: cisco-nxos
vendor: Cisco
os_family: nxos
identity_profiles: [cisco-nxos]
preferred_driver: paramiko
session:
  paging_off: [terminal width 511, terminal length 0]
  encoding: utf-8
  max_output_bytes: 4194304
budgets: {fast: 120, standard: 300, full: 600}
# Commands follow existing repository catalog/templates; hardware verification pending.
capabilities:
  version: {command: show version, parser: generic_version}
  lldp: {command: show lldp neighbors detail, parser: generic_lldp}
  interfaces: {command: show interface brief, parser: null}
  inventory: {command: show inventory, parser: null}
  ip: {command: show ip interface, parser: null}
  arp: {command: show ip arp, parser: generic_arp}
  mac: {command: show mac address-table, parser: generic_mac}
  vlan: {command: show vlan brief, parser: null}
  lag: {command: show port-channel summary, parser: null}
  routes: {command: show ip route, timeout: 300, parser: null}
  vrfs: {command: show vrf, parser: generic_vrfs}
  mlag: {command: show vpc brief, parser: null}
  vxlan: {command: show nve peers, parser: null}
verified: []
