manifest_version: 1
id: topology
name: 网络拓扑
version: 0.19.0
platform_api: '>=1.0,<2.0'
icon: network
dependencies:
  device-access: '>=0.7.0,<1.0.0'
  rule-governance: '>=1.8.0,<2.0.0'
  netconf-api: '>=0.11.0,<1.0.0'
backend:
  router: src.apps.topology.backend.api:router
  task_modules: [src.apps.topology.backend.tasks]
  task_names: [app.topology.execute, app.topology.reconcile]
  queue: app.topology
  schedules:
    - name: reconcile
      task: app.topology.reconcile
      seconds: 30
frontend:
  entry: frontend/index.tsx
agent:
  tools: src.apps.topology.backend.tools:TOOLS
database:
  mode: package
  migrations: migrations
  head: topology_0005
  tables: [app_topology_networks, app_topology_default_logins, app_topology_runs, app_topology_targets, app_topology_observations, app_topology_nodes, app_topology_aliases, app_topology_tps, app_topology_links, app_topology_snapshots, app_topology_resolutions, app_topology_collection_issues, app_twin_devices, app_twin_identity_aliases, app_twin_fact_sets, app_twin_arp, app_twin_device_members, app_twin_interfaces, app_twin_ip_addresses, app_twin_lldp, app_twin_mac, app_twin_routes, app_twin_vlans]
lifecycle:
  drain: src.apps.topology.backend.service:drain
  pending: src.apps.topology.backend.service:pending
