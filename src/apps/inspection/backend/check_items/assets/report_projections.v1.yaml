      - {column_id: optical_tx_dbm, source: interface.optical.tx_power, unit: dbm}
    status_columns: [execution_status, assessment_status, completeness_status, threshold_unknown_count, risk_verification_status, blocking_reason_codes]
    evidence_columns: [execution_id, snapshot_id, parser_template_id, runtime_bundle_digest, observed_at]
