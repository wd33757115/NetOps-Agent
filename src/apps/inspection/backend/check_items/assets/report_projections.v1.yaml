catalog_id: netops.report-projections
catalog_version: 1
status: active

profiles:
  - profile_id: device_inventory
    version: 1
    check_item_id: device.version
    source_kind: canonical_observation
    row_grain: device
    canonical_columns:
      - {column_id: software_version, source: device.software.version}
      - {column_id: hardware_model, source: device.hardware.model}
    status_columns: [execution_status, assessment_status, completeness_status, blocking_reason_codes]
    evidence_columns: [execution_id, snapshot_id, parser_template_id, runtime_bundle_digest, observed_at]
    sheet_id: device_version
    sort: [device_name, entity_key]
    null_policy: preserve_null

  - profile_id: cpu
    version: 1
    check_item_id: system.cpu_usage
    source_kind: canonical_observation
    row_grain: device_and_scope
    canonical_columns:
      - {column_id: cpu_instant_pct, source: device.cpu.utilization, dimensions: {window: instant}, unit: percent}
      - {column_id: cpu_5s_pct, source: device.cpu.utilization, dimensions: {window: 5s}, unit: percent}
      - {column_id: cpu_1m_pct, source: device.cpu.utilization, dimensions: {window: 1m}, unit: percent}
      - {column_id: cpu_5m_pct, source: device.cpu.utilization, dimensions: {window: 5m}, unit: percent}
      - {column_id: cpu_15m_pct, source: device.cpu.utilization, dimensions: {window: 15m}, unit: percent}
    status_columns: [execution_status, assessment_status, completeness_status, threshold_unknown_count, blocking_reason_codes]
    evidence_columns: [execution_id, snapshot_id, parser_template_id, runtime_bundle_digest, observed_at]
    sheet_id: cpu
    sort: [device_name, entity_key]
    null_policy: preserve_null

