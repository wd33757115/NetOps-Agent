catalog_version: parser-semantic-catalog-v1

applicability_profiles:
  optical_power_measurement: &optical_power_measurement
    version: 1
    on_missing_context: reject
    exclude_when:
      - code: transceiver_absent
        when:
          field: transceiver_present
          op: in_ci
          values: [absent, not present, notpresent, transceiver absent]
      - code: dom_unsupported
        when:
          field: dom_supported
          op: contains_any_ci
          values: [not support, unsupported, does not support]
      - code: measurement_not_applicable
        when:
          all:
            - {field: bias_ma, op: lte, value: 0}
            - {field: rx_power_dbm, op: equals_field, other_field: tx_power_dbm}
            - {field: rx_power_dbm, op: lte, value: -40}

field_aliases:
  interface: [interface, port, interface name, port name]
  oper_status: [status, state, link, physical, oper status, operational status]
  protocol_status: [protocol, line protocol]
  ip_address: [ip address, ip-address, primary ip, address]
  description: [description, desc, name]
  speed: [speed]
  duplex: [duplex]
  type: [type]
  vlan_id: [vlan, vlan id, pvid]
  vpn_instance: [vpn instance, vrf]
  transceiver_present:
    [transceiver present, transceiver presence, module present, present,
     the transceiver is absent, transceiver is absent, transceiver absent]
  dom_supported: [dom supported, diagnostic supported, diagnostics supported]
  rx_power_dbm: [rx power, receive power, receiver power, rx optical power, current rx power]
  tx_power_dbm: [tx power, transmit power, transmitter power, tx optical power, current tx power]
  rx_low_warning_dbm: [rx low warning, receive low warning, warning low rx power]
  rx_high_warning_dbm: [rx high warning, receive high warning, warning high rx power]
  tx_low_warning_dbm: [tx low warning, transmit low warning, warning low tx power]
  tx_high_warning_dbm: [tx high warning, transmit high warning, warning high tx power]
  rx_low_alarm_dbm: [rx low alarm, receive low alarm, alarm low rx power]
  rx_high_alarm_dbm: [rx high alarm, receive high alarm, alarm high rx power]
  tx_low_alarm_dbm: [tx low alarm, transmit low alarm, alarm low tx power]
  tx_high_alarm_dbm: [tx high alarm, transmit high alarm, alarm high tx power]
  temperature_celsius: [temperature, temp]
  temperature_high_alarm_celsius: [temperature high alarm, alarm high temperature]
  temperature_low_alarm_celsius: [temperature low alarm, alarm low temperature]
  temperature_high_warning_celsius: [temperature high warning, warning high temperature]
  temperature_low_warning_celsius: [temperature low warning, warning low temperature]
  voltage_v: [voltage]
  voltage_high_alarm_v: [voltage high alarm, alarm high voltage]
  voltage_low_alarm_v: [voltage low alarm, alarm low voltage]
  voltage_high_warning_v: [voltage high warning, warning high voltage]
  voltage_low_warning_v: [voltage low warning, warning low voltage]
  bias_ma: [bias, bias current]
  bias_high_alarm_ma: [bias high alarm, alarm high bias current]
  bias_low_alarm_ma: [bias low alarm, alarm low bias current]
  bias_high_warning_ma: [bias high warning, warning high bias current]
  bias_low_warning_ma: [bias low warning, warning low bias current]
  serial: [serial, serial number, device serial number]
  component: [component, slot, device name]
  model: [model, product id, pid, device name]

