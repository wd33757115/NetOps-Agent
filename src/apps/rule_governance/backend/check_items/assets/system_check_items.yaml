# System base check items that topology discovery consumes (owner decision 2026-10-04,
# docs/topology-rule-consumption.md). system_items.py expands them into same-name/v1
# check items and collection implementations. They cannot be deleted; a later version
# may only add optional Values.
#
# values: NAME: [value_type, required, description]. Keys are the entry identity and are
# TextFSM Values as well. value_type is one the check-item semantics accept.
# implementations: one default per platform family; a model exception adds a match on
# model_patterns (regular expressions) and a variant name, and wins on specificity.
# template is a path in the shared library src/skills/shared/textfsm-templates, pinned by
# the sha256 of its text: a changed template is refused until its pin (and the
# implementation version) is updated in review. scoped_command is the per-VRF form ({vrf} is a
# device-local instance name the consumer fills in); a command that itself needs an
# instance name carries {vrf} directly. valid_empty lists outputs that mean "none
# configured" (BLANK: an empty output). required lists lines every data output has (a
# table header); counts are totals the device prints ({pattern, of}: the pattern's first
# group counts the rows read, or the distinct keys). An output missing a required line
# or with a different count is never complete.
catalog: topology-system
version: 1

check_items:
  topology.arp:
    name: 拓扑发现：ARP 表项
    entity_type: arp_entry
    keys: [IP_ADDRESS]
    values:
      IP_ADDRESS: [ip_or_unassigned, true, 邻居的 IPv4 地址]
      MAC_ADDRESS: [text, true, 邻居 MAC 地址原文]
      INTERFACE: [text, false, 学到表项的接口；VSI 表项可能是链路 ID]
      VLAN_ID: [text, false, VLAN 或 VSI 名原文；长 VSI 名折行时按段给出，由使用方拼接]
      AGE: [text, false, 老化时间原文，单位以设备为准]
      TYPE: [text, false, 表项类型原文]

  topology.routes:
    name: 拓扑发现：路由表（每个下一跳一行）
    entity_type: route_next_hop
    keys: [NETWORK, PREFIX_LENGTH]
    values:
      NETWORK: [ip_or_unassigned, true, 目的网络地址]
      PREFIX_LENGTH: [integer, true, 掩码长度]
      PROTOCOL: [text, true, 路由来源代码或名称原文]
      TYPE: [text, false, IOS 路由子类型（如 IA、E2）]
      DISTANCE: [integer, false, 管理距离或优先级]
      METRIC: [integer, false, 度量值]
      NEXTHOP_IP: [ip_or_unassigned, false, 下一跳地址]
      NEXTHOP_IF: [text, false, 出接口原文]
      NEXTHOP_VRF: [text, false, 下一跳所在实例（IOS 显示时）]
      VRF: [text, false, 输出自己标明的路由表名]
      UPTIME: [text, false, 路由存在时间原文]
      FLAG: [text, false, IOS 路由标志]

  topology.vrf_detail:
    name: 拓扑发现：VRF/VPN 实例详情（每地址族一行）
    entity_type: vrf_address_family
    keys: [VRF, ADDRESS_FAMILY]
    values:
      VRF: [text, true, 设备本地实例名]
      ADDRESS_FAMILY: [text, true, 地址族原文；IOS-XE 的 stitching 即该实例的 EVPN 路由目标]
      RD: [text, false, 路由区分符；未设置为空或 <not set>]
      INTERFACES: [text, false, 绑定到该实例的接口]
      IMPORT_RT: [text, false, 导入的路由目标]
      EXPORT_RT: [text, false, 导出的路由目标]

  topology.evpn_peers:
    name: 拓扑发现：EVPN/VXLAN 每 VNI 的远端 VTEP
    entity_type: vxlan_peer
    keys: [VNI, PEER]
    values:
      VNI: [integer, true, VXLAN 网络标识]
      PEER: [ip_or_unassigned, true, 远端 VTEP 地址]
      TYPE: [text, false, IOS 的 L2CP/L3CP 等]
      STATE: [text, false, 对端状态原文]
      INSTANCE: [text, false, Comware 的 VSI 名]
      RD: [text, false, 远端路由区分符]
      INTERFACE: [text, false, IOS 的 NVE 接口]
      ROUTER_MAC: [text, false, L3 VNI 对端的路由器 MAC]
      EVNI: [integer, false, IOS 的出口 VNI]
      FLAGS: [text, false, IOS 标志]
      UPTIME: [text, false, 建立时长原文]
      TUNNEL_ADDRESS: [ip_or_unassigned, false, Comware 的隧道地址]
      ENCAPSULATION: [text, false, 封装方式原文]

  topology.ldp_peers:
    name: 拓扑发现：LDP 会话
    entity_type: ldp_peer
    keys: [PEER_LSR_ID]
    values:
      PEER_LSR_ID: [ip_or_unassigned, true, 对端 LSR ID]
      LABEL_SPACE: [integer, false, 对端标签空间]
      STATE: [text, false, 会话状态原文]
      ROLE: [text, false, 会话角色（Active/Passive）]
      LOCAL_LSR_ID: [ip_or_unassigned, false, 本端 LSR ID]
      LOCAL_LABEL_SPACE: [integer, false, 本端标签空间]
      DISCOVERY_INTERFACE: [text, false, 发现该对端的接口（与 DISCOVERY_ADDRESS 一一对应）]
      DISCOVERY_ADDRESS: [text, false, 发现报文的源地址]
      ADDRESSES: [text, false, 对端绑定的地址]

  topology.mpls_lfib:
    name: 拓扑发现：MPLS 标签转发表
    entity_type: lfib_entry
    keys: [FEC, LOCAL_LABEL, OUT_LABEL]
    values:
      FEC: [text, true, 转发等价类（前缀或地址）]
      LOCAL_LABEL: [text, true, 入标签原文（None 或 - 表示无）]
      OUT_LABEL: [text, true, 出标签原文（Pop Label、No Label、- 等）]
      INTERFACE: [text, false, 出接口原文]
      NEXTHOP: [text, false, 下一跳原文]
      VRF: [text, false, VPN 聚合标签所属的实例]
      PROTOCOL: [text, false, 标签来源协议原文]
      BYTES: [integer, false, 已交换字节数]
  topology.evpn_instances:
    name: 拓扑发现：EVPN 实例（IOS 每实例每 VLAN 一行）
    entity_type: evpn_instance
    keys: [INSTANCE]
    values:
      INSTANCE: [text, true, EVI 编号或 VSI 名]
      SERVICE: [text, false, IOS 的服务类型（VLAN Based 等）]
      RD: [text, false, 路由区分符]
      IMPORT_RT: [text, false, 导入的路由目标]
      EXPORT_RT: [text, false, 导出的路由目标]
      INSTANCE_STATE: [text, false, 实例状态原文]
      ENCAPSULATION: [text, false, 封装方式原文]
      VLAN_ID: [text, false, IOS 的 VLAN]
      STATE: [text, false, VLAN 段状态原文]
      VNI: [text, false, 二层 VNI（0 表示无）]
      L3_VNI: [text, false, 三层 VNI（0 表示无）]
      VTEP_IP: [ip_or_unassigned, false, 本端 VTEP 地址]
      VRF: [text, false, 三层 VNI 所属的 VRF]
      GATEWAY_INTERFACE: [text, false, 网关（Access If）接口]
      CORE_INTERFACE: [text, false, Core If 接口]
      ACCESS_INTERFACE: [text, false, 接入口（与 SERVICE_INSTANCE 一一对应）]
      SERVICE_INSTANCE: [text, false, 接入口的服务实例]
      PEER: [text, false, 远端 VTEP]

  topology.vxlan_vnis:
    name: 拓扑发现：VXLAN VNI 与 VSI
    entity_type: vxlan_vni
    keys: [VNI]
    values:
      VNI: [text, true, VXLAN 网络标识]
      INSTANCE: [text, false, Comware 的 VSI 名]
      L3_VNI: [text, false, 设备为三层 VNI 自建的 VSI 名中的 VNI]
      INTERFACE: [text, false, IOS 的 NVE 接口]
      MULTICAST_GROUP: [text, false, 组播组]
      STATE: [text, false, 状态原文]
      MODE: [text, false, IOS 的 L2CP/L3CP 等]
      SEGMENT_TYPE: [text, false, IOS 表头里的段类型（VLAN 或 BD）]
      SEGMENT: [text, false, VLAN 或桥域编号]
      CONFIG: [text, false, 配置来源]
      VRF: [text, false, 所属 VRF（N/A 表示无）]
      GATEWAY_INTERFACE: [text, false, Comware 的网关接口原文]
      TUNNEL: [text, false, VXLAN 隧道接口（与 TUNNEL_STATE 一一对应）]
      TUNNEL_STATE: [text, false, 隧道状态]
      ACCESS_INTERFACE: [text, false, 接入电路接口（与 ACCESS_STATE 一一对应）]
      ACCESS_STATE: [text, false, 接入电路状态]

  topology.tunnel_interfaces:
    name: 拓扑发现：隧道接口
    entity_type: tunnel_interface
    keys: [INTERFACE]
    values:
      INTERFACE: [text, true, 隧道接口名]
      STATE: [text, false, 接口状态原文]
      PROTOCOL_STATE: [text, false, 协议状态原文]
      SOURCE: [ip_or_unassigned, false, 隧道源地址]
      DESTINATION: [ip_or_unassigned, false, 隧道目的地址]
      MODE: [text, false, 隧道协议/传输原文]

  topology.evpn_mac:
    name: 拓扑发现：EVPN MAC 路由
    entity_type: evpn_mac_route
    keys: [MAC_ADDRESS, INSTANCE]
    values:
      MAC_ADDRESS: [text, true, MAC 地址原文]
      INSTANCE: [text, true, EVI 编号或 VSI 名]
      VLAN_ID: [text, false, IOS 的 VLAN]
      ESI: [text, false, 以太网段标识]
      ETHER_TAG: [text, false, 以太标签]
      NEXTHOP_VTEP: [ip_or_unassigned, false, 远端 VTEP]
      NEXTHOP_INTERFACE: [text, false, 本地接入口]
      SERVICE_INSTANCE: [text, false, 本地接入口的服务实例]
      FLAGS: [text, false, 标志原文]
      LOCAL_FLAG: [text, false, 本地学到（Comware 标志 L）]
      LINK: [text, false, 链路 ID 或名称]
      ENCAPSULATION: [text, false, 封装方式原文]
  topology.vrfs:
    name: 拓扑发现：VRF/VPN 实例列表
    entity_type: vrf
    keys: [NAME]
    values:
      NAME: [text, true, 设备本地实例名]
      RD: [text, false, 路由区分符]
      PROTOCOLS: [text, false, IOS 已启用的地址族（逗号分隔）]
      INTERFACES: [text, false, IOS 绑定的接口]
      CREATED: [text, false, Comware 的创建时间]
  topology.bgp_ipv4_peers:
    name: 拓扑发现：BGP IPv4 单播邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]

  topology.bgp_vpnv4_peers:
    name: 拓扑发现：BGP VPNv4 邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]

  topology.bgp_evpn_peers:
    name: 拓扑发现：BGP L2VPN EVPN 邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]

implementations:
  - check_item: topology.arp
    platform: ios
    command: show ip arp
    scoped_command: show ip arp vrf {vrf}
    template: Cisco/IOS/show_ip_arp__topology-1.0.0.textfsm
    sha256: fc5f65adbd929552fadc05e9d65861e637557ed24f16f58b71b21f6c853b81f3
    valid_empty: [BLANK]
    required: ['^Protocol\s+Address\s+Age \(min\)\s+Hardware Addr\s+Type\s+Interface\s*$']
  - check_item: topology.arp
    platform: comware
    command: display arp
    template: H3C/Comware7/display_arp__topology-1.0.0.textfsm
    sha256: 97affe44d2bf11b7ff57cbc86463a2b9cabd972030aa69e16b06081cc204edbb
    required: ['^IP address\s+MAC address\s+VLAN/VSI name\s+Interface/Link ID\s+Aging\s+Type\s*$']
  - check_item: topology.routes
    platform: ios
    command: show ip route
    scoped_command: show ip route vrf {vrf}
    template: Cisco/IOS/show_ip_route__topology-1.0.0.textfsm
    sha256: d8087d85683b4e669128d5120d654d7a93e85906254b71dc38528519390df20b
    required: ['^Gateway of last resort ']
  - check_item: topology.routes
    platform: comware
    command: display ip routing-table
    scoped_command: display ip routing-table vpn-instance {vrf}
    template: H3C/Comware7/display_ip_routing-table__topology-1.0.0.textfsm
    sha256: 68c4957d9d6ebb66c3b5783cd3c9c3c7e90e69cda4edb1164c5b9656e864851d
    required: ['^Destination/Mask\s+Proto\s+Pre\s+Cost\s+NextHop\s+Interface\s*$']
    counts:
      - {pattern: '^\s*Destinations\s*:\s*(\d+)\s+Routes\s*:\s*\d+\s*$', of: keys}
      - {pattern: '^\s*Destinations\s*:\s*\d+\s+Routes\s*:\s*(\d+)\s*$', of: rows}
  - check_item: topology.vrf_detail
    platform: ios
    command: show vrf detail
    template: Cisco/IOS/show_vrf_detail__topology-1.0.0.textfsm
    sha256: 9086ef2f312bbba974e5f60a3bfcf4dbe269212eca0ff6813b4268dceec0438b
    valid_empty: [BLANK]
  - check_item: topology.vrf_detail
    platform: comware
    command: display ip vpn-instance instance-name {vrf}
    template: H3C/Comware7/display_ip_vpn-instance_instance-name__topology-1.0.0.textfsm
    sha256: c45195b6fe49e71ca3086a942a4fb5f0a14e480e09b1d2ba45b0621774230f7b
  - check_item: topology.evpn_peers
    platform: ios
    command: show nve peers
    template: Cisco/IOS/show_nve_peers__topology-1.0.0.textfsm
    sha256: 6b8e6eb25295446caf1f7c68517ce356633f49200a1e64d5db1227261c2a6144
    valid_empty: [BLANK]
  - check_item: topology.evpn_peers
    platform: comware
    command: display evpn auto-discovery imet
    template: H3C/Comware7/display_evpn_auto-discovery_imet__topology-1.0.0.textfsm
    sha256: 3ed58acc8c850984224c95176f8b232c6204809f58659162375385737dfd5203
    valid_empty: [BLANK]

  - check_item: topology.ldp_peers
    platform: ios
    command: show mpls ldp neighbor
    template: Cisco/IOS/show_mpls_ldp_neighbor__topology-1.0.0.textfsm
    sha256: 692907d12c5acbcac928b5c7f93ee25a78d4d65e84f931da3ad731df626ddf60
    valid_empty: [BLANK]
  - check_item: topology.ldp_peers
    platform: comware
    command: display mpls ldp peer
    template: H3C/Comware7/display_mpls_ldp_peer__topology-1.0.0.textfsm
    sha256: a5101632bd203cb91ec273c04ac9a351bd2432ddb64b13c9e460f622837b63d1
    valid_empty: [BLANK]
    required: ['^\s*Peer LDP ID\s+State\s+Role\s+GR\s+MD5\s+KA Sent/Rcvd\s*$']
    counts:
      - {pattern: '^\s*Total number of peers:\s+(\d+)\s*$', of: rows}

  - check_item: topology.mpls_lfib
    platform: ios
    command: show mpls forwarding-table
    template: Cisco/IOS/show_mpls_forwarding-table__topology-1.0.0.textfsm
    sha256: fdf4c1f6bc7ca3a8a84c9212727753598f8a2a29dfd9fd7efcd85a59c07259af
    valid_empty: [BLANK, '\A\s*no MPLS apps enabled or MPLS not enabled on any interfaces\s*\Z']
    required: ['^Local\s+Outgoing\s+Prefix\s+Bytes Label\s+Outgoing\s+Next Hop\s*$']
  - check_item: topology.mpls_lfib
    platform: comware
    command: display mpls lsp
    template: H3C/Comware7/display_mpls_lsp__topology-1.0.0.textfsm
    sha256: a5bbe128f5d871eff41edb70e4e489080d1ae2a1490b836116af5922a6805f89
    valid_empty: [BLANK]
    required: ['^FEC\s+Proto\s+In/Out Label\s+Out Inter/NHLFE/LSINDEX\s*$']
  - check_item: topology.evpn_instances
    platform: ios
    command: show l2vpn evpn evi detail
    template: Cisco/IOS/show_l2vpn_evpn_evi_detail__topology-1.0.0.textfsm
    sha256: d5fad65ea291941f76060404fa1213e4ac3ea5d9c53590c8846c612663335239
    valid_empty: [BLANK]
  - check_item: topology.evpn_instances
    platform: comware
    command: display evpn instance verbose
    template: H3C/Comware7/display_evpn_instance_verbose__topology-1.0.0.textfsm
    sha256: 31b6ab26f9b6823c9df0ca73fd44b56fcde9a6775cb65ff3ef67fddec3e7ec3e
    valid_empty: [BLANK]
  - check_item: topology.vxlan_vnis
    platform: ios
    command: show nve vni
    template: Cisco/IOS/show_nve_vni__topology-1.0.0.textfsm
    sha256: b9eccd3d56c46f88d9febd953cfe0fa348aba0300e6211da372eed51bc2c44f3
    valid_empty: [BLANK]
  - check_item: topology.vxlan_vnis
    platform: comware
    command: display l2vpn vsi verbose
    template: H3C/Comware7/display_l2vpn_vsi_verbose__topology-1.0.0.textfsm
    sha256: 6c02bb04fefc82fde4294dfad16164fd2f446179eb5a0fd5529daa65f132463b
    valid_empty: [BLANK]
  - check_item: topology.tunnel_interfaces
    platform: comware
    command: display interface tunnel
    template: H3C/Comware7/display_interface_tunnel__topology-1.0.0.textfsm
    sha256: e1b7f3c7fdf02f0f4c41129b8c295b0fa82abad6bf0e57e293cd77d6fe32b002
    valid_empty: [BLANK]
  - check_item: topology.evpn_mac
    platform: ios
    command: show l2vpn evpn mac
    template: Cisco/IOS/show_l2vpn_evpn_mac__topology-1.0.0.textfsm
    sha256: 5e75699aa4af562da253ac31e23be31a6d4f53acbb02772581f4c076e3d6629d
    valid_empty: [BLANK]
  - check_item: topology.evpn_mac
    platform: comware
    command: display evpn route mac
    template: H3C/Comware7/display_evpn_route_mac__topology-1.0.0.textfsm
    sha256: 6fd1027699b29f95c3d027ddb30313b5fc53e7a8642d901809d57653d3a55989
    valid_empty: [BLANK]
  - check_item: topology.vrfs
    platform: ios
    command: show vrf
    template: Cisco/IOS/show_vrf__topology-1.0.0.textfsm
    sha256: d00df029d303c77f4e678ac25c2126bdf503d392370993aadc50ae35fc8e2388
    required: ['^\s*Name\s+Default RD\s+Protocols\s+Interfaces\s*$']
  - check_item: topology.vrfs
    platform: comware
    command: display ip vpn-instance
    template: H3C/Comware7/display_ip_vpn-instance__topology-1.0.0.textfsm
    sha256: 232ad0d3db0dc013bdfe1fca6e7602c6f48a56ae198aa24c25ca232039b05a7a
