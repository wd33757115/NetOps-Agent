      NATIVE_VLAN: [text, false, 基本表的 Native VLAN]
      ALLOWED_VLANS: [text, false, 允许的 VLAN 集合原文]
      ACTIVE_VLANS: [text, false, 允许且活动的 VLAN 集合原文]
      FORWARDING_VLANS: [text, false, 转发中的 VLAN 集合原文]
      BAD_ROW: [text, false, 该端口无法识别的行]

  topology.switchports:
    name: 拓扑发现：二层端口模式与 VLAN
    entity_type: switchport
    keys: [NAME]
    values:
      NAME: [text, true, 端口原文]
      SWITCHPORT: [text, false, 二层端口开关]
      ADMIN_MODE: [text, false, 管理模式]
      OPER_MODE: [text, false, 运行模式]
      ADMIN_ENCAPSULATION: [text, false, 管理封装]
      OPER_ENCAPSULATION: [text, false, 运行封装]
      ACCESS_VLAN: [text, false, Access VLAN 原文]
      NATIVE_VLAN: [text, false, Native VLAN 原文]
      ADMIN_NATIVE_TAGGING: [text, false, 管理上的 Native VLAN 打标]
      OPER_NATIVE_TAGGING: [text, false, 运行中的 Native VLAN 打标]
      TRUNK_VLANS: [text, false, Trunk 允许的 VLAN 原文]
      BAD_FIELD: [text, false, 该端口无法识别的字段或取值]
  topology.ospf_interfaces:
    name: 拓扑发现：OSPF 接口开销（简表，按行）
    entity_type: ospf_interface_line
    keys: [ADDRESS]
    values:
      ADDRESS: [text, true, 接口地址（IOS 带掩码）]
      TABLE: [text, false, 表头行]
      INTERFACE: [text, false, IOS 的接口原文]
      PROCESS_ID: [text, false, 进程号]
      ROUTER_ID: [text, false, Comware 进程头的路由器 ID]
      LABEL: [text, false, Comware 的 Interfaces 标签行]
      AREA: [text, false, 区域]
      TYPE: [text, false, Comware 的网络类型]
      STATE: [text, false, 接口状态原文]
      COST: [text, false, 开销原文]
      PRIORITY: [text, false, Comware 的优先级]
      DR: [text, false, Comware 的 DR]
      BDR: [text, false, Comware 的 BDR]
      NEIGHBORS: [text, false, IOS 的邻居数（全毗邻/总数）]
      BAD_ROW: [text, false, 无法识别的行余下部分]

  topology.ospf_process:
    name: 拓扑发现：OSPF 进程与接口映射（按行）
    entity_type: ospf_process_line
    keys: [PROCESS_ID]
    values:
      PROCESS_ID: [text, true, 进程号]
      ROUTER_ID: [text, false, 进程头的路由器 ID]
      AREA: [text, false, 区域]
      VRF_EVIDENCE: [text, false, Comware 未启用多 VPN 实例的输出证据]
      CONFIRMED_ROUTER_ID: [text, false, Comware 再次给出的路由器 ID]
      ADDRESS: [text, false, Comware 的接口地址]
      INTERFACE: [text, false, Comware 的接口名]
      COST: [text, false, Comware 的接口开销原文]
      STATE: [text, false, Comware 的接口状态原文]

  topology.pbr_bindings:
    # 2026-10-05: a path hop entering on such an interface may not follow the route table.
    name: 拓扑发现：策略路由的接口绑定
    entity_type: pbr_binding
    keys: [INTERFACE, POLICY]
    values:
      INTERFACE: [text, true, 应用策略路由的接口；local 或 N/A 表示本机发出的报文]
      POLICY: [text, true, 策略名（route-map 或 policy-based-route 名）]
      TYPE: [text, false, 策略类型原文（如 Forward、Local）]

  topology.nat_bindings:
    # 2026-10-05: a path hop through such an interface may have its addresses translated.
    name: 拓扑发现：NAT 的接口绑定
    entity_type: nat_binding
    keys: [INTERFACE, KIND]
    values:
      INTERFACE: [text, true, 绑定 NAT 的接口；IOS 一行可列多个，以逗号分隔]
      KIND: [text, true, 绑定方式原文（Inside、Outside、outbound、internal server、static、inbound）]
      RULE: [text, false, 规则引用原文（如 ACL 编号）]

  topology.acl_rules:
    # 2026-10-05: the IPv4 ACL entries a path is checked against, in match order.
    name: 拓扑发现：IPv4 ACL 规则
    entity_type: acl_rule
    keys: [ACL_NAME, LINE_NUM]
    values:
      ACL_TYPE: [text, false, ACL 类型原文（Standard、Extended、Basic、Advanced）]
      ADDRESS_FAMILY: [text, false, 地址族原文（IP、IPv4）]
      ACL_NAME: [text, true, ACL 名或编号]
      MATCH_ORDER: [text, false, 匹配顺序（auto 表示按深度优先排列，设备已按匹配顺序列出）]
      LINE_NUM: [integer, true, 规则序号（IOS 序号、Comware rule 编号）]
      ACTION: [text, false, 动作（permit、deny）；无法识别的规则没有]
      PROTOCOL: [text, false, 协议名或号码；没有表示任意 IP 报文]
      SRC_HOST: [ip_or_unassigned, false, 源主机地址]
      SRC_ANY: [text, false, 源为任意（any）]
      SRC_NETWORK: [ip_or_unassigned, false, 源地址]
      SRC_WILDCARD: [text, false, 源通配符（Comware 主机为 0）]
      SRC_NETWORK_OBJECT_GROUP_NAME: [text, false, 源地址对象组名]
      SRC_PORT_MATCH: [text, false, 源端口比较（eq、neq、lt、gt）]
      SRC_PORT: [text, false, 源端口：名称（www、domain、dns 等）或号码，eq 后可有多个，以空格分隔]
      SRC_PORT_RANGE_START: [text, false, 源端口范围起点]
      SRC_PORT_RANGE_END: [text, false, 源端口范围终点]
      DST_HOST: [ip_or_unassigned, false, 目的主机地址]
      DST_ANY: [text, false, 目的为任意（any）]
      DST_NETWORK: [ip_or_unassigned, false, 目的地址]
      DST_WILDCARD: [text, false, 目的通配符（Comware 主机为 0）]
      DST_NETWORK_OBJECT_GROUP_NAME: [text, false, 目的地址对象组名]
      DST_PORT_MATCH: [text, false, 目的端口比较（eq、neq、lt、gt）]
      DST_PORT: [text, false, 目的端口：名称（www、domain、dns 等）或号码，eq 后可有多个，以空格分隔]
      DST_PORT_RANGE_START: [text, false, 目的端口范围起点]
      DST_PORT_RANGE_END: [text, false, 目的端口范围终点]
      ICMP_TYPE: [text, false, ICMP 类型名或号码（名称可同时代表代码）]
      ICMP_CODE: [text, false, ICMP 代码号]
      TCP_FLAG: [text, false, TCP 标志条件（established：带 ACK 或 RST 的报文）]
      FRAGMENTS: [text, false, 只匹配非首片分片]
      TIME: [text, false, 时间段名]
      STATE: [text, false, 采集时时间段是否生效（active、inactive）]
      VRF: [text, false, 规则限定的 VPN 实例；没有时的含义由实现声明]
      OTHER: [text, false, 模板不认识的条件原文；有它的规则不按缺省条件计算]
      MATCHES: [integer, false, 命中次数]

  topology.acl_bindings:
    # 2026-10-05: which ACL filters which direction of an interface, and what it does with
    # packets no entry matches.
    name: 拓扑发现：ACL 的接口绑定
    entity_type: acl_binding
    keys: [INTERFACE, DIRECTION]
    values:
      INTERFACE: [text, true, 接口]
      DIRECTION: [text, true, 方向原文（Inbound、Outgoing、Outbound）]
      ADDRESS_FAMILY: [text, false, 地址族原文（IPv4、IPv6、MAC）]
      ACL_NAME: [text, false, 绑定的 ACL 名或编号]
      SCOPE: [text, false, ACL 的作用范围（Common：与接口自己的 ACL 一起生效）]
      STATUS: [text, false, 绑定状态原文（如 Failed：未生效）]
      DEFAULT_ACTION: [text, false, 没有规则命中时的动作（Permit、Deny）]

  topology.security_zones:
    # 2026-10-05: between security zones traffic is denied unless a security policy
    # permits it, which a path does not evaluate.
    name: 拓扑发现：安全域成员
    entity_type: security_zone_member
    keys: [ZONE, INTERFACE]
    values:
      ZONE: [text, true, 安全域名]
      INTERFACE: [text, true, 成员接口]

  topology.nat_rules:
    # 2026-10-05: the NAT rules a path applies (source NAT by ACL, static mappings, port
    # mappings) and the address pools they translate to.
    name: 拓扑发现：NAT 规则
    entity_type: nat_rule
    keys: [KIND]
    values:
      KIND: [text, true, 规则种类原文（pool、inside source list、inside source static、address group、outbound、internal server、Static 等）]
      POOL: [text, false, 地址池名或地址组号（--- 表示不用地址池）]
      POOL_START: [ip_or_unassigned, false, 地址池起始地址]
      POOL_END: [ip_or_unassigned, false, 地址池结束地址]
      INTERFACE: [text, false, 规则绑定的接口（Comware）]
      ACL_NAME: [text, false, 决定哪些报文转换的 ACL（--- 表示全部）]
      TO_INTERFACE: [text, false, 转换成该接口的地址（IOS interface）]
      OVERLOAD: [text, false, 端口复用（IOS overload）]
      NO_PAT: [text, false, 不做端口转换（Comware NO-PAT：Y、N）]
      PROTOCOL: [text, false, 端口映射的协议名或号码]
      LOCAL_ADDRESS: [ip_or_unassigned, false, 内部地址]
      LOCAL_PORT: [text, false, 内部端口]
      GLOBAL_ADDRESS: [ip_or_unassigned, false, 外部地址]
      GLOBAL_INTERFACE: [text, false, 以该接口的地址为外部地址（IOS interface）]
      GLOBAL_PORT: [text, false, 外部端口]
      VRF: [text, false, 规则所在的 VPN 实例]
      STATUS: [text, false, 规则状态原文（如 Active）]
      OTHER: [text, false, 模板不认识的规则内容；有它的规则不计算]

  topology.pbr_rules:
    # 2026-10-06: the content of an IPv4 policy route, which a path evaluates at the hops
    # its bindings name (topology.pbr_bindings). One row per node.
    name: 拓扑发现：策略路由的节点
    entity_type: pbr_rule
    keys: [POLICY, NODE]
    values:
      POLICY: [text, true, 策略名]
      NODE: [integer, true, 节点号（按从小到大的顺序匹配）]
      MODE: [text, true, 节点模式（permit、deny）]
      MATCH_ACL: [text, false, 节点匹配的 ACL（if-match acl）]
      NEXT_HOP: [ip_or_unassigned, false, 节点设置的唯一下一跳（apply next-hop）]
      OTHER: [text, false, 模板不认识的条件或动作原文；有它的节点不计算]

implementations:
  - check_item: topology.arp
    platform: ios
    command: show ip arp
    scoped_command: show ip arp vrf {vrf}
    units: {AGE: min}  # the "Age (min)" column prints bare numbers
    template: Cisco/IOS/show_ip_arp__topology-1.0.0.textfsm
    sha256: fc5f65adbd929552fadc05e9d65861e637557ed24f16f58b71b21f6c853b81f3
    valid_empty: [BLANK]
    required: ['^Protocol\s+Address\s+Age \(min\)\s+Hardware Addr\s+Type\s+Interface\s*$']
  - check_item: topology.arp
    platform: comware
    version: 2
    command: display arp verbose
    template: H3C/Comware7/display_arp_verbose__topology-1.0.0.textfsm
    sha256: adfa8013759f67e6cdb9bdbe8283ed4c5b8ea58a32b64acc0eebb74975d39987
    required: ['^IP address\s+:']
  - check_item: topology.routes
    platform: ios
    command: show ip route
    scoped_command: show ip route vrf {vrf}
    # The per-VRF table names its instance; any other name is refused.
    scope_header: '^Routing Table: (\S+)\s*$'
    template: Cisco/IOS/show_ip_route__topology-1.0.0.textfsm
    sha256: d8087d85683b4e669128d5120d654d7a93e85906254b71dc38528519390df20b
    required: ['^Gateway of last resort ']
  - check_item: topology.routes
    platform: comware
    command: display ip routing-table
    scoped_command: display ip routing-table vpn-instance {vrf}
    template: H3C/Comware7/display_ip_routing-table__topology-1.0.0.textfsm
    sha256: 68c4957d9d6ebb66c3b5783cd3c9c3c7e90e69cda4edb1164c5b9656e864851d
    required: ['^Destination/Mask\s+Proto\s+Pre\s+Cost\s+NextHop\s+Interface\s*$']
    counts:
      - {pattern: '^\s*Destinations\s*:\s*(\d+)\s+Routes\s*:\s*\d+\s*$', of: keys}
      - {pattern: '^\s*Destinations\s*:\s*\d+\s+Routes\s*:\s*(\d+)\s*$', of: rows}
