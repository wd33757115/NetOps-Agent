# System base check items that topology discovery consumes (owner decision 2026-10-04).
# system_items.py expands them into same-name/v1
# check items and collection implementations. They cannot be deleted; a later version
# may only add optional Values.
#
# values: NAME: [value_type, required, description]. Keys are the entry identity and are
# TextFSM Values as well. value_type is one the check-item semantics accept.
# implementations: one default per platform family; a model exception adds a match on
# model_patterns (regular expressions) and a variant name, and wins on specificity.
# template is a path in the shared library src/skills/shared/textfsm-templates, pinned by
# the sha256 of its text: a changed template is refused until its pin (and the
# implementation version) is updated in review. scoped_command is the per-VRF form ({vrf} is a
# device-local instance name the consumer fills in); a command that itself needs an
# instance name carries {vrf} directly. scope_header is the line (first group: the name) by
# which a per-VRF output names its instance; without it the consumer checks the output
# against the device's interface bindings instead. units names the unit of a Value the
# device prints as a bare number ({AGE: min}). defaults gives a Value the device never
# prints because it is fixed for the platform (the action for packets no IOS ACL entry
# matches); a row that has the Value keeps its own. valid_empty lists outputs that mean "none
# configured" (BLANK: an empty output). required lists lines every data output has (a
# table header); counts are totals the device prints ({pattern, of}: the pattern's first
# group counts the rows read, or the distinct keys). An output missing a required line
# or with a different count is never complete.
catalog: topology-system
version: 1

check_items:
  topology.arp:
    # v2 (2026-10-04): the instance and VSI of each entry, as Comware's verbose table
    # shows them; a device that lists one instance per command leaves VRF empty.
    version: 2
    name: 拓扑发现：ARP 表项
    entity_type: arp_entry
    keys: [IP_ADDRESS]
    values:
      IP_ADDRESS: [ip_or_unassigned, true, 邻居的 IPv4 地址]
      MAC_ADDRESS: [text, true, 邻居 MAC 地址原文]
      INTERFACE: [text, false, 学到表项的接口；VSI 表项可能是链路 ID]
      VLAN_ID: [text, false, VLAN 或 VSI 名原文；长 VSI 名折行时按段给出，由使用方拼接]
      AGE: [text, false, 老化时间原文，单位以设备为准]
      TYPE: [text, false, 表项类型原文]
      VRF: [text, false, 表项所属的 VPN 实例；"--" 为公网；按实例分命令采集的设备不填]
      VSI: [text, false, 学到表项的 VSI 名；"--" 为无]
      VSI_INTERFACE: [text, false, VSI 表项所属的三层接口（VSI 网关接口）；"--" 为无]

  topology.routes:
    name: 拓扑发现：路由表（每个下一跳一行）
    entity_type: route_next_hop
    keys: [NETWORK, PREFIX_LENGTH]
    values:
      NETWORK: [ip_or_unassigned, true, 目的网络地址]
      PREFIX_LENGTH: [integer, true, 掩码长度]
      PROTOCOL: [text, true, 路由来源代码或名称原文]
      TYPE: [text, false, IOS 路由子类型（如 IA、E2）]
      DISTANCE: [integer, false, 管理距离或优先级]
      METRIC: [integer, false, 度量值]
      NEXTHOP_IP: [ip_or_unassigned, false, 下一跳地址]
      NEXTHOP_IF: [text, false, 出接口原文]
      NEXTHOP_VRF: [text, false, 下一跳所在实例（IOS 显示时）]
      VRF: [text, false, 输出自己标明的路由表名]
      UPTIME: [text, false, 路由存在时间原文]
      FLAG: [text, false, IOS 路由标志]

  topology.vrf_detail:
    name: 拓扑发现：VRF/VPN 实例详情（每地址族一行）
    entity_type: vrf_address_family
    keys: [VRF, ADDRESS_FAMILY]
    values:
      VRF: [text, true, 设备本地实例名]
      ADDRESS_FAMILY: [text, true, 地址族原文；IOS-XE 的 stitching 即该实例的 EVPN 路由目标]
      RD: [text, false, 路由区分符；未设置为空或 <not set>]
      INTERFACES: [text, false, 绑定到该实例的接口]
      IMPORT_RT: [text, false, 导入的路由目标]
      EXPORT_RT: [text, false, 导出的路由目标]

  topology.evpn_peers:
    name: 拓扑发现：EVPN/VXLAN 每 VNI 的远端 VTEP
    entity_type: vxlan_peer
    keys: [VNI, PEER]
    values:
      VNI: [integer, true, VXLAN 网络标识]
      PEER: [ip_or_unassigned, true, 远端 VTEP 地址]
      TYPE: [text, false, IOS 的 L2CP/L3CP 等]
      STATE: [text, false, 对端状态原文]
      INSTANCE: [text, false, Comware 的 VSI 名]
      RD: [text, false, 远端路由区分符]
      INTERFACE: [text, false, IOS 的 NVE 接口]
      ROUTER_MAC: [text, false, L3 VNI 对端的路由器 MAC]
      EVNI: [integer, false, IOS 的出口 VNI]
      FLAGS: [text, false, IOS 标志]
      UPTIME: [text, false, 建立时长原文]
      TUNNEL_ADDRESS: [ip_or_unassigned, false, Comware 的隧道地址]
      ENCAPSULATION: [text, false, 封装方式原文]

  topology.ldp_peers:
    name: 拓扑发现：LDP 会话
    entity_type: ldp_peer
    keys: [PEER_LSR_ID]
    values:
      PEER_LSR_ID: [ip_or_unassigned, true, 对端 LSR ID]
      LABEL_SPACE: [integer, false, 对端标签空间]
      STATE: [text, false, 会话状态原文]
      ROLE: [text, false, 会话角色（Active/Passive）]
      LOCAL_LSR_ID: [ip_or_unassigned, false, 本端 LSR ID]
      LOCAL_LABEL_SPACE: [integer, false, 本端标签空间]
      DISCOVERY_INTERFACE: [text, false, 发现该对端的接口（与 DISCOVERY_ADDRESS 一一对应）]
      DISCOVERY_ADDRESS: [text, false, 发现报文的源地址]
      ADDRESSES: [text, false, 对端绑定的地址]

  topology.mpls_lfib:
    name: 拓扑发现：MPLS 标签转发表
    entity_type: lfib_entry
    keys: [FEC, LOCAL_LABEL, OUT_LABEL]
    values:
      FEC: [text, true, 转发等价类（前缀或地址）]
      LOCAL_LABEL: [text, true, 入标签原文（None 或 - 表示无）]
      OUT_LABEL: [text, true, 出标签原文（Pop Label、No Label、- 等）]
      INTERFACE: [text, false, 出接口原文]
      NEXTHOP: [text, false, 下一跳原文]
      VRF: [text, false, VPN 聚合标签所属的实例]
      PROTOCOL: [text, false, 标签来源协议原文]
      BYTES: [integer, false, 已交换字节数]
  topology.evpn_instances:
    name: 拓扑发现：EVPN 实例（IOS 每实例每 VLAN 一行）
    entity_type: evpn_instance
    keys: [INSTANCE]
    values:
      INSTANCE: [text, true, EVI 编号或 VSI 名]
      SERVICE: [text, false, IOS 的服务类型（VLAN Based 等）]
      RD: [text, false, 路由区分符]
      IMPORT_RT: [text, false, 导入的路由目标]
      EXPORT_RT: [text, false, 导出的路由目标]
      INSTANCE_STATE: [text, false, 实例状态原文]
      ENCAPSULATION: [text, false, 封装方式原文]
      VLAN_ID: [text, false, IOS 的 VLAN]
      STATE: [text, false, VLAN 段状态原文]
      VNI: [text, false, 二层 VNI（0 表示无）]
      L3_VNI: [text, false, 三层 VNI（0 表示无）]
      VTEP_IP: [ip_or_unassigned, false, 本端 VTEP 地址]
      VRF: [text, false, 三层 VNI 所属的 VRF]
      GATEWAY_INTERFACE: [text, false, 网关（Access If）接口]
      CORE_INTERFACE: [text, false, Core If 接口]
      ACCESS_INTERFACE: [text, false, 接入口（与 SERVICE_INSTANCE 一一对应）]
      SERVICE_INSTANCE: [text, false, 接入口的服务实例]
      PEER: [text, false, 远端 VTEP]

  topology.vxlan_vnis:
    name: 拓扑发现：VXLAN VNI 与 VSI
    entity_type: vxlan_vni
    keys: [VNI]
    values:
      VNI: [text, true, VXLAN 网络标识]
      INSTANCE: [text, false, Comware 的 VSI 名]
      L3_VNI: [text, false, 设备为三层 VNI 自建的 VSI 名中的 VNI]
      INTERFACE: [text, false, IOS 的 NVE 接口]
      MULTICAST_GROUP: [text, false, 组播组]
      STATE: [text, false, 状态原文]
      MODE: [text, false, IOS 的 L2CP/L3CP 等]
      SEGMENT_TYPE: [text, false, IOS 表头里的段类型（VLAN 或 BD）]
      SEGMENT: [text, false, VLAN 或桥域编号]
      CONFIG: [text, false, 配置来源]
      VRF: [text, false, 所属 VRF（N/A 表示无）]
      GATEWAY_INTERFACE: [text, false, Comware 的网关接口原文]
      TUNNEL: [text, false, VXLAN 隧道接口（与 TUNNEL_STATE 一一对应）]
      TUNNEL_STATE: [text, false, 隧道状态]
      ACCESS_INTERFACE: [text, false, 接入电路接口（与 ACCESS_STATE 一一对应）]
      ACCESS_STATE: [text, false, 接入电路状态]

  topology.tunnel_interfaces:
    name: 拓扑发现：隧道接口
    entity_type: tunnel_interface
    keys: [INTERFACE]
    values:
      INTERFACE: [text, true, 隧道接口名]
      STATE: [text, false, 接口状态原文]
      PROTOCOL_STATE: [text, false, 协议状态原文]
      SOURCE: [ip_or_unassigned, false, 隧道源地址]
      DESTINATION: [ip_or_unassigned, false, 隧道目的地址]
      MODE: [text, false, 隧道协议/传输原文]

  topology.evpn_mac:
    name: 拓扑发现：EVPN MAC 路由
    entity_type: evpn_mac_route
    keys: [MAC_ADDRESS, INSTANCE]
    values:
      MAC_ADDRESS: [text, true, MAC 地址原文]
      INSTANCE: [text, true, EVI 编号或 VSI 名]
      VLAN_ID: [text, false, IOS 的 VLAN]
      ESI: [text, false, 以太网段标识]
      ETHER_TAG: [text, false, 以太标签]
      NEXTHOP_VTEP: [ip_or_unassigned, false, 远端 VTEP]
      NEXTHOP_INTERFACE: [text, false, 本地接入口]
      SERVICE_INSTANCE: [text, false, 本地接入口的服务实例]
      FLAGS: [text, false, 标志原文]
      LOCAL_FLAG: [text, false, 本地学到（Comware 标志 L）]
      LINK: [text, false, 链路 ID 或名称]
      ENCAPSULATION: [text, false, 封装方式原文]
  topology.vrfs:
    name: 拓扑发现：VRF/VPN 实例列表
    entity_type: vrf
    keys: [NAME]
    values:
      NAME: [text, true, 设备本地实例名]
      RD: [text, false, 路由区分符]
      PROTOCOLS: [text, false, IOS 已启用的地址族（逗号分隔）]
      INTERFACES: [text, false, IOS 绑定的接口]
      CREATED: [text, false, Comware 的创建时间]
  topology.bgp_ipv4_peers:
    name: 拓扑发现：BGP IPv4 单播邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]

  topology.bgp_vpnv4_peers:
    name: 拓扑发现：BGP VPNv4 邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]

  topology.bgp_evpn_peers:
    name: 拓扑发现：BGP L2VPN EVPN 邻居
    entity_type: bgp_neighbor
    keys: [PEER]
    values:
      PEER: [ip_or_unassigned, true, 邻居地址]
      PEER_AS: [integer, true, 邻居 AS]
      STATE: [text, false, 会话状态原文（IOS 已建立时显示收到的前缀数而不显示状态）]
      PREFIXES_RECEIVED: [integer, false, 收到的前缀数]
      UP_DOWN: [text, false, 会话建立或断开时长原文]
      ROUTER_ID: [ip_or_unassigned, false, 本端 BGP 标识（表头）]
      LOCAL_AS: [integer, false, 本端 AS（表头）]
  topology.ospf_neighbors:
    name: 拓扑发现：OSPF 邻居
    entity_type: ospf_neighbor
    keys: [NEIGHBOR_ID, INTERFACE]
    values:
      NEIGHBOR_ID: [ip_or_unassigned, true, 邻居路由器 ID]
      INTERFACE: [text, true, 本端接口原文]
      ADDRESS: [ip_or_unassigned, false, 邻居接口地址]
      PRIORITY: [integer, false, 邻居优先级]
      STATE: [text, false, 邻居状态原文]
      ROLE: [text, false, DR/BDR 角色原文（- 表示无）]
      DEAD_TIME: [text, false, 失效时间原文]
      PROCESS: [text, false, 进程号（Comware 表头）]
      ROUTER_ID: [ip_or_unassigned, false, 本端路由器 ID（Comware 表头）]
      AREA: [text, false, 区域（Comware 表头）]
  topology.vrrp:
    name: 拓扑发现：VRRP 组
    entity_type: vrrp_group
    keys: [INTERFACE, VRID]
    values:
      INTERFACE: [text, true, 接口原文]
      VRID: [integer, true, 虚拟路由器编号]
      STATE: [text, false, 状态原文]
      PRIORITY: [integer, false, 运行优先级]
      VIRTUAL_IP: [text, false, 虚拟地址]
      MASTER_IP: [text, false, 主设备地址]
  topology.lag:
    name: 拓扑发现：链路聚合组与成员
    entity_type: lag
    keys: [INTERFACE]
    values:
      INTERFACE: [text, true, 聚合接口原文]
      GROUP: [integer, false, 聚合组号]
      BUNDLE_FLAGS: [text, false, 聚合接口标志原文]
      PROTOCOL: [text, false, 聚合协议原文]
      MEMBERS: [text, false, 成员端口（与 MEMBER_FLAGS 一一对应）]
      MEMBER_FLAGS: [text, false, 成员端口标志原文]
      BUNDLED: [text, false, 已捆绑进聚合的成员]
  topology.stp_ports:
    name: 拓扑发现：生成树端口角色与状态
    entity_type: stp_port
    keys: [INSTANCE, INTERFACE]
    values:
      INSTANCE: [text, true, 生成树实例原文（VLAN0010、MST0）]
      INTERFACE: [text, true, 端口原文]
      VLAN_ID: [text, false, PVST 实例的 VLAN]
      MSTI: [text, false, MSTP 实例号]
      PROTOCOL: [text, false, 生成树协议原文]
      ROLE: [text, false, 端口角色原文]
      STATE: [text, false, 端口状态原文]
      COST: [integer, false, 端口开销]
      PORT_ID: [text, false, 端口优先级与编号]
      TYPE: [text, false, 链路类型与边缘端口标记原文]
      ROOT_PRIORITY: [integer, false, 根桥优先级（实例头）]
      ROOT_ADDRESS: [text, false, 根桥 MAC（实例头）]
      ROOT_PORT: [text, false, 根端口（实例头）]
      IS_ROOT: [text, false, 本桥即根桥（实例头）]
      BRIDGE_PRIORITY: [integer, false, 本桥优先级（实例头）]
      BRIDGE_ADDRESS: [text, false, 本桥 MAC（实例头）]
  topology.interfaces:
    name: 拓扑发现：接口状态
    entity_type: interface
    keys: [INTERFACE]
    values:
      INTERFACE: [text, true, 接口原文]
      LINK: [text, true, 链路状态原文（含管理关闭）]
      PROTOCOL: [text, false, 协议状态原文]
      DESCRIPTION: [text, false, 接口描述]
      MODE: [text, false, Comware 表的模式（route/bridge）]
      PRIMARY_IP: [text, false, Comware 路由模式表的主地址]
      SPEED: [text, false, Comware 桥模式表的速率原文]
      DUPLEX: [text, false, Comware 桥模式表的双工原文]
      TYPE: [text, false, Comware 桥模式表的链路类型（A/T/H）]
      PVID: [text, false, Comware 桥模式表的 PVID]
  topology.ip_interfaces:
    name: 拓扑发现：接口地址
    entity_type: interface_address
    keys: [INTERFACE]
    values:
      INTERFACE: [text, true, 接口原文]
      ADDRESS: [text, false, Comware 的地址/掩码长度（-- 为无）]
      ADDRESSES: [text, false, IOS 的主地址与从地址（地址/掩码长度）]
      VRF: [text, false, 所属 VRF（-- 为公网）]
      STATUS: [text, false, IOS 的接口状态原文]
      PHYSICAL: [text, false, Comware 的物理状态原文]
      PROTOCOL: [text, false, 协议状态原文]
      DESCRIPTION: [text, false, Comware 的接口描述（可能截断）]
  topology.mac:
    name: 拓扑发现：MAC 地址表项
    entity_type: mac_entry
    keys: [MAC_ADDRESS, VLAN_ID]
    values:
      MAC_ADDRESS: [text, true, MAC 地址原文]
      VLAN_ID: [text, true, VLAN 原文]
      PORT: [text, false, 出端口原文]
      TYPE: [text, false, IOS 的表项类型原文]
      STATE: [text, false, Comware 的表项状态原文]
      AGING: [text, false, Comware 是否老化]
  topology.vlans:
    name: 拓扑发现：VLAN 与端口列
    entity_type: vlan
    keys: [VLAN_ID]
    values:
      VLAN_ID: [integer, true, VLAN 编号]
      NAME: [text, false, VLAN 名称]
      STATUS: [text, false, IOS 的 VLAN 状态原文]
      PORTS: [text, false, 端口列每行的原文（逗号或空格分隔）]
  topology.lldp_neighbors:
    name: 拓扑发现：LLDP 邻居
    entity_type: lldp_neighbor
    keys: [LOCAL_INTERFACE, CHASSIS_ID, PORT_ID]
    values:
      LOCAL_INTERFACE: [text, true, 本端端口原文]
      CHASSIS_ID: [text, true, 邻居机箱 ID 原文]
      PORT_ID: [text, true, 邻居端口 ID 原文]
      CHASSIS_ID_TYPE: [text, false, 机箱 ID 子类型原文]
      PORT_ID_TYPE: [text, false, 端口 ID 子类型原文]
      NEIGHBOR_NAME: [text, false, 邻居系统名]
      SYSTEM_DESCRIPTION: [text, false, 邻居系统描述（按行）]
      MGMT_ADDRESS: [text, false, 邻居管理地址]
  topology.device_version:
    name: 拓扑发现：设备版本与身份
    entity_type: device
    keys: [OS_VERSION]
    values:
      OS_VERSION: [text, true, 软件版本原文]
      MODEL: [text, false, 型号]
      SERIAL: [text, false, 序列号]
      HOSTNAME: [text, false, 主机名（IOS）]
      IMAGE_NAME: [text, false, IOS 镜像名]
      IMAGE_VERSION: [text, false, IOS 镜像版本]
      UNIX_PROCESSOR: [text, false, IOS 以 Linux 进程运行时的处理器]
