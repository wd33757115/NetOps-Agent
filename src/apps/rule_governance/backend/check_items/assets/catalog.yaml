catalog_version: 12
defaults:
  check_item:
    freshness_policy:
      max_observation_age: 24h
      max_collection_span: 8h
      clock_skew_tolerance: 10m
    empty_result_policy:
      classification: invalid
  implementation:
    output_quality_policy:
      profile_version: 1
      minimum_non_whitespace_chars: 1
      unsupported_patterns:
      - '%\s*(?:invalid input|unrecognized command)'
      - error:\s*unrecognized command
      - (?:wrong|invalid) parameter found
      - unrecognized command found
      - incomplete command found
      command_error_patterns:
      - permission denied
      - authorization failed
      - insufficient privilege
      - command execution failed
      truncation_patterns:
      - (?im)^\s*(?:%|\[)?\s*output\s+(?:was\s+)?truncated\b
      - (?im)^\s*\[\s*truncated\s*\]\s*$
      - (?im)^\s*\.\.\.\s+(?:output\s+)?omitted\s+\.\.\.\s*$
      paging_patterns:
      - (?im)(?:--|----)\s*more\s*(?:--|----)
      - (?im)^\s*press\s+(?:any\s+key|space|enter)\s+to\s+continue
      - (?im)^\s*more:\s*<space>
check_items:
- id: device.version
  version: 3
  name: Device version and inventory
  category: device
  description: Preserve software, platform and chassis identity for audit and comparison.
  result_mode: structured
  assessment_mode: evidence
  canonical_contract:
    entity_type: device
    identity_dimensions:
    - device_id
    observations:
    - observation_type: device.software.version
      semantic_type: state
      canonical_field: os_version
    - observation_type: device.hardware.model
      semantic_type: state
      canonical_field: model
    parser_field_vocabulary:
      hostname:
        aliases:
        - device_name
        role: context
      os_version:
        aliases:
        - version
        - software_version
        - nxos_version
        - system_version
        observation_type: device.software.version
        role: state
      software_release:
        aliases:
        - release
        role: state
      software_image:
        aliases:
        - image
        - system_image
        role: state
      boot_image:
        aliases:
        - running_image
        - bootfile
        role: state
      bootloader_version:
        aliases:
        - rommon_version
        - bootware_version
        role: state
      model:
        aliases:
        - platform
        - hardware_model
        observation_type: device.hardware.model
        role: state
      serial_number:
        aliases:
        - serial
        - serial_num
        - sn
        role: identity
      member:
        aliases:
        - switch_number
        - stack_member
        role: identity
      active_marker:
        aliases:
        - active
        - role_marker
        role: state
      uptime:
        role: context
      reload_reason:
        aliases:
        - last_reboot_reason
        role: state
  report_projection: device_inventory
  applicability: {}
  coverage_policy:
    model: fixed
    expected_count: 1
    require_rule_evaluation: false
  status: active
- id: system.cpu_usage
  version: 12
  name: CPU 使用率
  category: system
  description: Evaluate system, slot or processor CPU utilization.
  result_mode: structured
  assessment_mode: health
  canonical_contract:
    entity_type: cpu_scope
    identity_dimensions:
    - slot
    - cpu
    identity_dimension_rules:
      slot:
        kind: identifier
      cpu:
        kind: identifier
    value_contract: same-name/v1
    hardware_value_revision: hardware-values/v1
    observations:
    - canonical_field: cpu_5s_percent
      observation_type: system.cpu_usage.cpu_5s_percent
      semantic_type: gauge
      value_type: number
      unit: percent
      description: 明确标注 last 5 seconds 的 CPU 使用率
      required: false
      assessment_roles:
      - evidence
      dimensions: []
      fixed_dimensions:
        window: 5s
    - canonical_field: cpu_1m_percent
      observation_type: system.cpu_usage.cpu_1m_percent
      semantic_type: gauge
      value_type: number
      unit: percent
      description: 明确标注 last 1 minute 的 CPU 使用率
      required: false
      assessment_roles:
      - evidence
      dimensions: []
      fixed_dimensions:
        window: 1m
    - observation_type: device.cpu.utilization
      semantic_type: gauge
      unit: percent
      canonical_field: cpu_usage_percent
      dimensions: []
      policy_constraints:
        allowed_compare_modes:
        - threshold_and_deadband
        applies_to_dimensions:
          window:
          - 5m
        require_structured_threshold_references: true
        required_threshold_reference_any:
        - high
        - critical_high
        required_deadband: 5
        allowed_minimum_durations:
        - null
        - 0s
        evidence_only_reason: true
      event_constraints:
        role_event_types:
          high: CpuUtilizationHigh
          critical_high: CpuUtilizationCritical
          high_recovery: CpuUtilizationRecovered
        required_event_types:
        - CpuUtilizationHigh
        - CpuUtilizationCritical
        - CpuUtilizationRecovered
        required_event_classes:
          CpuUtilizationHigh: fault
          CpuUtilizationCritical: fault
          CpuUtilizationRecovered: recovery
        required_severities:
          CpuUtilizationHigh: warning
          CpuUtilizationCritical: critical
          CpuUtilizationRecovered: info
        allow_critical: true
        required_recovery_pairs:
        - fault: CpuUtilizationHigh
          recovery: CpuUtilizationRecovered
        - fault: CpuUtilizationCritical
          recovery: CpuUtilizationRecovered
        max_rule_count: 3
      threshold_references:
        high:
          field_name: cpu_high_warning_percent
        critical_high:
          field_name: cpu_high_alarm_percent
      health_policy:
        revision: device-limits-with-directional-trends-v2
        window: 5m
        baseline_mode: trend_only
        trend:
          kind: utilization_increase
          threshold_ratio: 0.1
          min_increase_points: 10
        device_thresholds:
          high:
          - cpu_high_warning_percent
          - cpu_high_alarm_percent
      required: true
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
    - observation_type: device.cpu.high_warning
      semantic_type: threshold
      unit: percent
      canonical_field: cpu_high_warning_percent
      dimensions: []
      required: false
      assessment_roles:
      - reference
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
    - observation_type: device.cpu.high_alarm
      semantic_type: threshold
      unit: percent
      canonical_field: cpu_high_alarm_percent
      dimensions: []
      required: false
      assessment_roles:
      - reference
      value_type: number
      fixed_dimensions:
        window: 5m
      description: 设备明确输出的五分钟平均使用率或对应阈值；不能填入瞬时值或容量推算值
    rule_semantics_snapshot:
      catalog_id: netops.canonical-observations
      version: 5
      digest: c4d3613d81b45085b28f6d4189c7f7cdd2e634c57494786c9f791c0e7f4c2738
      observations:
      - id: device.cpu.utilization
        description: CPU utilization for one canonical CPU scope and time window.
        semantic_type: gauge
        value_types:
        - number
        canonical_unit: percent
        dimensions:
        - window
        allowed_dimension_values:
          window:
          - instant
          - 5s
          - 1m
          - 5m
          - 15m
        allowed_values: []
        state_groups: {}
        assessment_roles:
        - current_state
        - change
      - id: device.cpu.high_warning
        description: Device-output or approved device-profile CPU warning threshold.
        semantic_type: threshold
        value_types:
        - number
        canonical_unit: percent
        dimensions:
        - window
        allowed_dimension_values: {}
        allowed_values: []
        state_groups: {}
        assessment_roles:
        - reference
      - id: device.cpu.high_alarm
        description: Device-output or approved device-profile CPU alarm threshold.
        semantic_type: threshold
        value_types:
        - number
        canonical_unit: percent
        dimensions:
        - window
        allowed_dimension_values: {}
        allowed_values: []
        state_groups: {}
        assessment_roles:
        - reference
      - id: system.cpu_usage.cpu_5s_percent
        description: 明确标注 last 5 seconds 的 CPU 使用率
        semantic_type: gauge
        value_types:
        - number
        canonical_unit: percent
        dimensions:
        - window
        allowed_dimension_values:
          window:
          - 5s
        allowed_values: []
        state_groups: {}
        assessment_roles:
        - evidence
      - id: system.cpu_usage.cpu_1m_percent
        description: 明确标注 last 1 minute 的 CPU 使用率
        semantic_type: gauge
        value_types:
        - number
        canonical_unit: percent
        dimensions:
        - window
        allowed_dimension_values:
          window:
          - 1m
        allowed_values: []
        state_groups: {}
        assessment_roles:
        - evidence
  report_projection: auto@1
  applicability: {}
  freshness_policy:
    max_observation_age: 24h
    max_collection_span: 8h
    clock_skew_tolerance: 10m
  empty_result_policy:
    classification: invalid
  coverage_policy:
    model: derived_entity_set
    source: previous_qualified_observation
    first_observation: unable_to_determine
  status: active
