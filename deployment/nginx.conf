# Uploads: the original, still-encoded path after /object-storage, so the signature matches.
map $request_uri $object_storage_uri {
    ~^/object-storage(?<rest>/.*)$ $rest;
    default /;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Resolve the BFF through Docker's DNS on every request, so a recreated django
    # container (new address) is reached without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff http://django:8001;

    # 前端静态文件（SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 所有 API 请求统一代理到 Django BFF
    location /api/ {
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream as server-sent events and can run for minutes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 浏览器上传文件：原样转给 MinIO。网关按 minio:9000 签名，Host 必须相同。
    location /object-storage/ {
        proxy_pass http://minio:9000$object_storage_uri;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 5g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket 统一经 Django BFF 代理
    location /ws/ {
        proxy_pass $bff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
