name: NetOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_repository_scope.py

  lint:
    needs: repository-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff black pyyaml
      - run: ruff check src/ tests/ scripts/
      - run: black --check --diff src/ tests/ scripts/
      - name: Documentation governance gate
        run: |
          python scripts/docs/audit_docs.py --strict-unregistered --all-links
          python scripts/deprecations/audit_deprecations.py
          python scripts/check_utf8.py docs scripts/docs --mojibake

  test-fastapi:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netops_agent
          POSTGRES_USER: netops
          POSTGRES_PASSWORD: netops123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --timeout 30 -k "not (e2e or skill_system)"
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          DEBUG: "false"
      - name: Rule control required gate
        run: |
          pytest \
            tests/unit/test_rule_control_jobs.py \
            tests/unit/test_runtime_rule_assets.py \
            tests/unit/test_rule_asset_template_activation.py \
            tests/unit/test_rule_asset_submitter_skill.py \
            tests/unit/test_rule_asset_persister_skill.py \
            tests/unit/test_rule_asset_approver_skill.py \
            -v --timeout 30
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          DEBUG: "false"
      - name: Device management required gate
        run: |
          pytest \
            tests/unit/test_device_management_api.py \
            tests/unit/test_device_patrol_runner.py \
            tests/unit/test_device_identity_discovery.py \
            tests/unit/test_device_backup_runner.py \
            -v --timeout 30
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          DEBUG: "false"
      - name: Patrol and parser quality gate
        run: |
          pytest \
            tests/unit/test_patrol_change_event_pipeline.py \
            tests/unit/test_parser_work_queue.py \
            tests/unit/test_patrol_production_readiness.py \
            tests/unit/test_patrol_coverage_policy.py \
            -v --timeout 30
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          DEBUG: "false"

  test-django:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r web/django_backend/requirements.txt
      - run: cd web/django_backend && python -m django check --settings=django_backend.settings
      - run: |
          cd web/django_backend
          python -c "from bff.urls import urlpatterns; assert any('skills/' in str(p.pattern) for p in urlpatterns); print('BFF skills routes OK')"

  test-skills-ui:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/integration/test_skills_api.py -v

  test-frontend:
    needs: lint
    # Visual baselines are generated with the Windows Chrome rendering stack.
    # Keep CI on the same platform to avoid font rasterization false positives.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web/react_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/react_frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run check:ci

  docker-build:
    needs: [test-fastapi, test-django, test-skills-ui, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f deployment/docker-compose.yml --profile core config --quiet
      - run: docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.ai.yml --profile core --profile ai config --quiet
      - run: docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.ai.yml -f deployment/docker-compose.prod.yml --profile core --profile ai config --quiet
      - run: docker build -t netops-gateway-core -f deployment/Dockerfile.fastapi --build-arg REQUIREMENTS_FILE=deployment/requirements/gateway.txt .
      - run: docker build -t netops-worker-core -f deployment/Dockerfile.core-worker --build-arg REQUIREMENTS_FILE=deployment/requirements/core.txt .
      - run: docker build -t netops-worker-ai -f deployment/Dockerfile.core-worker --build-arg REQUIREMENTS_FILE=deployment/requirements/ai-worker.txt .
      - run: docker build -t netops-django -f deployment/Dockerfile.django .
      - run: docker build -t netops-react -f deployment/Dockerfile.react --build-arg VITE_API_BASE_URL=/api .
