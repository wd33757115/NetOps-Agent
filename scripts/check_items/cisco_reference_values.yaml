    - CURRENT
    source_kind: ntc
    unit: ma
  - canonical_field: transceiver_type
    semantic_type: text
    value_type: text
    description: 模块类型原文，例如 QSFP-100G。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: vendor_name
    semantic_type: text
    value_type: text
    description: 模块 name/vendor 原文，不由设备厂商推断。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: revision
    semantic_type: text
    value_type: text
    description: 光模块硬件修订号。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: wavelength_nm
    semantic_type: gauge
    value_type: number
    description: 模块波长；只有源输出明确 nm 时使用。
