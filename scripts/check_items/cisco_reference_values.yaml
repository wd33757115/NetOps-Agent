schema_version: check-item-value-reference/v1
revision: cisco-samples-2026-09-23
# interface.runtime_statistics 保持既有定义，不纳入本轮字段完善。
items:
- id: device.version
  name: 设备版本与资产信息
  new: false
  identity_dimensions: null
  references:
  - template: cisco_ios_show_version.textfsm
    sha256: 00ec4a1fabf7f83781c85c205ae8656b5fbee4abff5a30c1d19783d7e218303e
    values:
    - SOFTWARE_IMAGE
    - VERSION
    - RELEASE
    - ROMMON
    - HOSTNAME
    - UPTIME
    - UPTIME_YEARS
    - UPTIME_WEEKS
    - UPTIME_DAYS
    - UPTIME_HOURS
    - UPTIME_MINUTES
    - RELOAD_REASON
    - RUNNING_IMAGE
    - HARDWARE
    - SERIAL
    - CONFIG_REGISTER
    - MAC_ADDRESS
    - RESTARTED
  - template: cisco_nxos_show_version.textfsm
    sha256: d3118b91026289ef1bef77e3a2f71a1de19261e6cbde491d7aeb02f49c6bf226
    values:
    - UPTIME
    - LAST_REBOOT_REASON
    - BIOS
    - OS
    - BOOT_IMAGE
    - PLATFORM
    - HOSTNAME
    - SERIAL
  record_notes: 保留已确认的七项必填及槽位/子槽位粒度。NTC OS/VERSION 参考 SOFTWARE_VERSION，PLATFORM/HARDWARE
    参考 BOARD_TYPE，LAST_REBOOT_REASON/RELOAD_REASON 参考 REBOOT_REASON；不增加运行时别名映射。Cisco
    不提供槽位或两种镜像时仍报告不完整，不能拿 BOOT_IMAGE 同时填两列。
  fields:
  - canonical_field: HOSTNAME
    semantic_type: text
    value_type: text
    description: 设备主机名原文；不是管理 IP。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - HOSTNAME
    source_kind: ntc
  - canonical_field: SERIAL
    semantic_type: text
    value_type: text
    description: 对应板卡或设备序列号；NTC 的多成员 List 不能拼成一个槽位值。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - SERIAL
    source_kind: ntc
  - canonical_field: BIOS
    semantic_type: text
    value_type: text
    description: NX-OS BIOS 版本原文。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - BIOS
    source_kind: ntc
  - canonical_field: ROMMON
    semantic_type: text
    value_type: text
    description: IOS 引导程序版本；不等同于 BOOT_IMAGE。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - ROMMON
    source_kind: ntc
  - canonical_field: SOFTWARE_IMAGE
    semantic_type: text
    value_type: text
    description: IOS 软件特性镜像标识，不能替代实际系统镜像路径。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - SOFTWARE_IMAGE
    source_kind: ntc
  - canonical_field: RELEASE
    semantic_type: text
    value_type: text
    description: IOS Release 修饰原文。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - RELEASE
    source_kind: ntc
  - canonical_field: CONFIG_REGISTER
    semantic_type: text
    value_type: text
    description: 配置寄存器值，保留十六进制文本。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - CONFIG_REGISTER
    source_kind: ntc
  - canonical_field: MAC_ADDRESS
    semantic_type: text
    value_type: text
    description: 设备或板卡基础 MAC；多成员地址须按所属板卡展开。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - MAC_ADDRESS
    source_kind: ntc
  - canonical_field: RESTARTED
    semantic_type: text
    value_type: text
    description: 最近重启时间原文；与 UPTIME、重启原因分别保存。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - RESTARTED
    source_kind: ntc
- id: device.inventory
  name: 硬件组件资产
  new: false
  identity_dimensions: null
  references:
  - template: cisco_ios_show_inventory.textfsm
    sha256: 02e276e51f12a9b710d8c23e5a70628cada702c96b31d20ac9807f23425c44be
    values:
    - NAME
    - DESCR
    - PID
    - VID
    - SN
  - template: cisco_nxos_show_inventory.textfsm
    sha256: 6cc5ab81a504a679e9bc7806f87df08a3027c0d3f97d9b2bdd7e81eb4adb3be3
    values:
    - NAME
    - DESCR
    - PID
    - VID
    - SN
  record_notes: 每个物理组件一行；保留原有 model、serial_number、vendor_name 与实体键。没有组件类型时须显式指出身份缺口。
  fields:
  - canonical_field: name
    semantic_type: text
    value_type: text
    description: 组件名称原文，保留机箱、槽位和收发器位置。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - NAME
    source_kind: ntc
  - canonical_field: description
    semantic_type: text
    value_type: text
    description: 组件完整描述。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - DESCR
    source_kind: ntc
  - canonical_field: product_id
    semantic_type: text
    value_type: text
    description: 厂商产品编号；PID 在 inventory 中不是进程号。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - PID
    source_kind: ntc
  - canonical_field: hardware_version
    semantic_type: text
    value_type: text
    description: 硬件修订号；不等同于软件版本。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - VID
    source_kind: ntc
- id: environment.fan
  name: 风扇状态
  new: false
  identity_dimensions: null
  references:
  - template: cisco_nxos_show_environment.textfsm
    sha256: ada88fb6ab46f3f2043237c96d5d8ee899e81aa09b4ff31aa74dd274078c3b6d
    values:
    - POWER_SUPPLY
    - POWER_SUPPLY_MODEL
    - POWER_SUPPLY_OUTPUT
    - POWER_SUPPLY_INPUT
    - POWER_SUPPLY_CAPACITY
    - POWER_SUPPLY_STATUS
    - FAN
    - FAN_STATUS
    - TEMPERATURE_MODULE
    - TEMPERATURE_SENSOR
    - TEMPERATURE_MAJOR_THRESH
    - TEMPERATURE_MINOR_THRESH
    - TEMPERATURE_CURRENT
    - TEMPERATURE_STATUS
  record_notes: 保留 fan_status 与气流方向。NTC FAN/FAN_STATUS 对应原有 fan/fan_status；slot 只能来自明确位置。
  fields:
  - canonical_field: fan_model
    semantic_type: text
    value_type: text
    description: 风扇型号；当前 NTC 模板未保留该列，来自样本 Model 列。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: hardware_revision
    semantic_type: text
    value_type: text
    description: 风扇硬件版本原文，-- 表示未提供。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: speed_rpm
    semantic_type: gauge
    value_type: number
    description: IOS 环境传感器明确给出的风扇转速；不能把十六进制 Fan Zone Speed 当 RPM。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
    unit: rpm
- id: environment.power
  name: 电源状态
  new: false
  identity_dimensions: null
  references:
  - template: cisco_nxos_show_environment.textfsm
    sha256: ada88fb6ab46f3f2043237c96d5d8ee899e81aa09b4ff31aa74dd274078c3b6d
    values:
    - POWER_SUPPLY
    - POWER_SUPPLY_MODEL
    - POWER_SUPPLY_OUTPUT
    - POWER_SUPPLY_INPUT
    - POWER_SUPPLY_CAPACITY
    - POWER_SUPPLY_STATUS
    - FAN
    - FAN_STATUS
    - TEMPERATURE_MODULE
    - TEMPERATURE_SENSOR
    - TEMPERATURE_MAJOR_THRESH
    - TEMPERATURE_MINOR_THRESH
    - TEMPERATURE_CURRENT
    - TEMPERATURE_STATUS
  record_notes: 每个电源一行。POWER_SUPPLY_OUTPUT 对应 output_watts；禁止把设备 Total Power 汇总值复制到每个电源。
  fields:
  - canonical_field: model
    semantic_type: text
    value_type: text
    description: 电源模块型号。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - POWER_SUPPLY_MODEL
    source_kind: ntc
  - canonical_field: input_watts
    semantic_type: gauge
    value_type: number
    description: 单个电源实际输入功率。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - POWER_SUPPLY_INPUT
    source_kind: ntc
    unit: w
  - canonical_field: capacity_watts
    semantic_type: gauge
    value_type: number
    description: 单个电源额定容量，不是当前输出功率。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - POWER_SUPPLY_CAPACITY
    source_kind: ntc
    unit: w
  - canonical_field: input_state
    semantic_type: text
    value_type: text
    description: 输入供电状态原文。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
  - canonical_field: output_state
    semantic_type: text
    value_type: text
    description: 输出供电状态原文。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
- id: environment.temperature
  name: 温度传感器状态
  new: false
  identity_dimensions: null
  references:
  - template: cisco_nxos_show_environment_temperature.textfsm
    sha256: 0d1921cf16e914dbc936709734119576245413ef0d20bb635189acc0c5c8f3d4
    values:
    - CURRENT_VALUE
    - MAJOR_THRESHOLD
    - MINOR_THRESHOLD
    - STATUS
    - MODULE
    - SENSOR
  - template: cisco_ios_show_environment_temperature.textfsm
    sha256: 79f9929cd7afb1b8623deaeea6a9e2da6f2619de31da462a2c2eba67fc48253f
    values:
    - SWITCH
    - SWITCH_TEMPERATURE
    - INLET_TEMPERATURE_VALUE
    - INLET_TEMPERATURE_STATE
    - INLET_YELLOW_THRESHOLD
    - INLET_RED_THRESHOLD
    - HOTSPOT_TEMPERATURE_VALUE
    - HOTSPOT_TEMPERATURE_STATE
    - HOTSPOT_YELLOW_THRESHOLD
    - HOTSPOT_RED_THRESHOLD
  record_notes: MODULE/SENSOR 对应 slot/sensor；CURRENT_VALUE、MINOR_THRESHOLD、MAJOR_THRESHOLD
    对应现有温度、warning 和 alarm。未知单位不自动当摄氏度。
  fields:
  - canonical_field: sensor_status
    semantic_type: text
    value_type: text
    description: 设备报告的温度传感器状态；保留 Ok/Normal 等原文。
    required: false
    assessment_roles:
    - evidence
    ntc_values:
    - STATUS
    source_kind: ntc
  - canonical_field: temperature_low_warning_celsius
    semantic_type: threshold
    value_type: number
    description: 设备明确报告的低温告警阈值；未输出时缺失。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
    unit: celsius
  - canonical_field: temperature_low_alarm_celsius
    semantic_type: threshold
    value_type: number
    description: 设备明确报告的低温严重告警阈值。
    required: false
    assessment_roles:
    - evidence
    ntc_values: []
    source_kind: sample_cli
    unit: celsius
