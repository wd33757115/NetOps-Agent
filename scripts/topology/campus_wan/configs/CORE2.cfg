hostname CORE2
no ip domain lookup
ip domain name lab.local
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
lldp run
!
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description OOB-MGMT
 vrf forwarding MGMT
 ip address 10.10.1.14 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to BR2 GE3/0
 ip address 10.0.24.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to BR1 GE4/0
 ip address 10.0.14.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 description to CORE1 e0/3
 ip address 10.0.34.1 255.255.255.254
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/0
 description to DIST2 e0/1
 ip address 10.0.46.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/1
 description to DIST1 e0/2
 ip address 10.0.45.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
router ospf 1
 router-id 10.255.0.4
 passive-interface Loopback0
!
router bgp 65000
 bgp router-id 10.255.0.4
 bgp log-neighbor-changes
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.1 route-reflector-client
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 10.255.0.2 route-reflector-client
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source Loopback0
 neighbor 10.255.0.5 remote-as 65000
 neighbor 10.255.0.5 update-source Loopback0
 neighbor 10.255.0.5 route-reflector-client
 neighbor 10.255.0.6 remote-as 65000
 neighbor 10.255.0.6 update-source Loopback0
 neighbor 10.255.0.6 route-reflector-client
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
