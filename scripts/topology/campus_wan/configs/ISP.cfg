hostname ISP
no ip domain lookup
!
interface Loopback0
 description internet
 ip address 8.8.8.8 255.255.255.0
!
interface Ethernet0/0
 shutdown
!
interface Ethernet0/1
 description to AS65000 BR1
 ip address 100.64.1.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description to AS65000 BR2
 ip address 100.64.2.1 255.255.255.252
 no shutdown
!
interface Ethernet0/3
 description customer LAN
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
interface Ethernet1/0
 shutdown
!
interface Ethernet1/1
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
router bgp 65100
 bgp router-id 8.8.8.8
 bgp log-neighbor-changes
 network 8.8.8.0 mask 255.255.255.0
 network 198.51.100.0 mask 255.255.255.0
 neighbor 100.64.1.2 remote-as 65000
 neighbor 100.64.1.2 default-originate
 neighbor 100.64.2.2 remote-as 65000
 neighbor 100.64.2.2 default-originate
!
line con 0
 exec-timeout 0 0
 logging synchronous
!
end
