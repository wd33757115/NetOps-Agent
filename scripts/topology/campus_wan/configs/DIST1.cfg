hostname DIST1
no ip domain lookup
ip domain name lab.local
ip routing
vtp mode transparent
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
lldp run
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 4096
spanning-tree vlan 20 priority 8192
!
vlan 10
 name USERS-A
vlan 20
 name USERS-B
!
interface Loopback0
 ip address 10.255.0.5 255.255.255.255
 ip ospf 1 area 0
!
interface Port-channel1
 description to DIST2 Po1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20
 switchport mode trunk
!
interface Ethernet0/0
 description OOB-MGMT
 no switchport
 vrf forwarding MGMT
 ip address 10.10.1.15 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to CORE1 e1/0
 no switchport
 ip address 10.0.35.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to CORE2 e1/1
 no switchport
 ip address 10.0.45.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 shutdown
!
interface Ethernet1/0
 description to DIST2 e1/0
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 channel-group 1 mode active
!
interface Ethernet1/1
 description to DIST2 e1/1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 channel-group 1 mode active
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
interface Ethernet2/0
 description to ACC1 e0/1
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20
 switchport mode trunk
!
interface Ethernet2/1
 description to ACC2 e0/2
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20
 switchport mode trunk
!
interface Ethernet2/2
 shutdown
!
interface Ethernet2/3
 shutdown
!
interface Ethernet3/0
 shutdown
!
interface Ethernet3/1
 shutdown
!
interface Ethernet3/2
 shutdown
!
interface Ethernet3/3
 shutdown
!
interface Vlan10
 description USERS-A gateway
 ip address 172.16.10.2 255.255.255.0
 vrrp 10 ip 172.16.10.1
 vrrp 10 priority 110
 ip ospf 1 area 10
 no shutdown
!
interface Vlan20
 description USERS-B gateway
 ip address 172.16.20.2 255.255.255.0
 vrrp 20 ip 172.16.20.1
 ip ospf 1 area 10
 no shutdown
!
router ospf 1
 router-id 10.255.0.5
 passive-interface Loopback0
 passive-interface Vlan10
 passive-interface Vlan20
!
router bgp 65000
 bgp router-id 10.255.0.5
 bgp log-neighbor-changes
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source Loopback0
 neighbor 10.255.0.4 remote-as 65000
 neighbor 10.255.0.4 update-source Loopback0
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
