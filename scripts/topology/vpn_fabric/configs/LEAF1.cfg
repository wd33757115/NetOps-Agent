hostname LEAF1
no ip domain lookup
ip domain name lab.local
ip routing
vtp mode transparent
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
lldp run
!
l2vpn evpn
 replication-type ingress
 router-id Loopback0
!
l2vpn evpn instance 10 vlan-based
 encapsulation vxlan
 route-target export 65100:10010
 route-target import 65100:10010
!
vlan 10
 name RED
!
vlan configuration 10
 member evpn-instance 10 vni 10010
!
interface Loopback0
 ip address 10.255.10.11 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description OOB-MGMT
 no switchport
 vrf forwarding MGMT
 ip address 10.10.1.23 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to SPINE1 e0/1
 no switchport
 ip address 10.10.11.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to SPINE2 e0/1
 no switchport
 ip address 10.10.21.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/0
 description to H-R1
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface nve1
 no ip address
 source-interface Loopback0
 host-reachability protocol bgp
 member vni 10010 ingress-replication
!
router ospf 1
 router-id 10.255.10.11
 passive-interface Loopback0
!
router bgp 65100
 bgp router-id 10.255.10.11
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.10.1 remote-as 65100
 neighbor 10.255.10.1 update-source Loopback0
 neighbor 10.255.10.2 remote-as 65100
 neighbor 10.255.10.2 update-source Loopback0
 address-family l2vpn evpn
  neighbor 10.255.10.1 activate
  neighbor 10.255.10.1 send-community both
  neighbor 10.255.10.2 activate
  neighbor 10.255.10.2 send-community both
 exit-address-family
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
