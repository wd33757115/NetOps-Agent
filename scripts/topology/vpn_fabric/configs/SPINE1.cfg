hostname SPINE1
no ip domain lookup
ip domain name lab.local
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
lldp run
!
interface Loopback0
 ip address 10.255.10.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description OOB-MGMT
 vrf forwarding MGMT
 ip address 10.10.1.21 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to LEAF1 e0/1
 ip address 10.10.11.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description to LEAF2 e0/1
 ip address 10.10.12.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/3
 description to LEAF3 GE2/0
 ip address 10.10.13.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet1/0
 shutdown
!
interface Ethernet1/1
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
router ospf 1
 router-id 10.255.10.1
 passive-interface Loopback0
!
router bgp 65100
 bgp router-id 10.255.10.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.10.11 remote-as 65100
 neighbor 10.255.10.11 update-source Loopback0
 neighbor 10.255.10.12 remote-as 65100
 neighbor 10.255.10.12 update-source Loopback0
 neighbor 10.255.10.13 remote-as 65100
 neighbor 10.255.10.13 update-source Loopback0
 address-family l2vpn evpn
  neighbor 10.255.10.11 activate
  neighbor 10.255.10.11 send-community both
  neighbor 10.255.10.11 route-reflector-client
  neighbor 10.255.10.12 activate
  neighbor 10.255.10.12 send-community both
  neighbor 10.255.10.12 route-reflector-client
  neighbor 10.255.10.13 activate
  neighbor 10.255.10.13 send-community both
  neighbor 10.255.10.13 route-reflector-client
 exit-address-family
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
