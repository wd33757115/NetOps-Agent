hostname PE1
no ip domain lookup
ip domain name lab.local
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
vrf definition CUST-A
 rd 65200:1
 address-family ipv4
  route-target export 65200:1
  route-target import 65200:1
  route-target import 65200:99
 exit-address-family
!
vrf definition CUST-B
 rd 65200:2
 address-family ipv4
  route-target export 65200:2
  route-target import 65200:2
 exit-address-family
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
lldp run
!
interface Loopback0
 ip address 10.255.20.1 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description OOB-MGMT
 vrf forwarding MGMT
 ip address 10.10.1.26 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to P e0/1
 ip address 10.20.12.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface Ethernet0/2
 shutdown
!
interface Ethernet0/3
 shutdown
!
interface Ethernet1/0
 description to A1 (CUST-A site 1)
 vrf forwarding CUST-A
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface Ethernet1/1
 description to B1 (CUST-B site 1)
 vrf forwarding CUST-B
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
router ospf 1
 router-id 10.255.20.1
 passive-interface Loopback0
!
router bgp 65200
 bgp router-id 10.255.20.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.20.3 remote-as 65200
 neighbor 10.255.20.3 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.20.3 activate
  neighbor 10.255.20.3 send-community extended
 exit-address-family
 address-family ipv4 vrf CUST-A
  redistribute connected
 exit-address-family
 address-family ipv4 vrf CUST-B
  redistribute connected
 exit-address-family
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
