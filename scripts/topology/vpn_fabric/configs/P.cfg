hostname P
no ip domain lookup
ip domain name lab.local
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
lldp run
!
interface Loopback0
 ip address 10.255.20.2 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description OOB-MGMT
 vrf forwarding MGMT
 ip address 10.10.1.27 255.255.255.0
 no lldp transmit
 no lldp receive
 no shutdown
!
interface Ethernet0/1
 description to PE1 e0/1
 ip address 10.20.12.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description to PE2 GE2/0
 ip address 10.20.23.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface Ethernet0/3
 shutdown
!
interface Ethernet1/0
 shutdown
!
interface Ethernet1/1
 shutdown
!
interface Ethernet1/2
 shutdown
!
interface Ethernet1/3
 shutdown
!
router ospf 1
 router-id 10.255.20.2
 passive-interface Loopback0
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
